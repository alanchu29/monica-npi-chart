<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monica NPI Project Chart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Enhanced scrollbar styles */
        .custom-scrollbar::-webkit-scrollbar { 
            width: 10px; 
            height: 14px; 
        }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: #f8fafc; 
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #64748b; 
            border-radius: 10px;
            border: 3px solid #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #3b82f6; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:active {
            background: #1d4ed8;
        }

        input:focus, select:focus { border-color: #3b82f6; ring: 2px #3b82f6; outline: none; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans text-[12px]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzT2YXUNxWbmpoJHm8lU7GuyN__eSrYkfFCSrM6Te3AlO0Lks9ds4z_1SUQpVbLYFyyvQ/exec";
        const GAS_URL_STORAGE_KEY = "monica-npi-gas-webapp-url";

        const readInitialGasUrl = () => {
            try {
                const q = new URLSearchParams(window.location.search).get("gas");
                if (q) {
                    const decoded = decodeURIComponent(q.trim());
                    if (decoded) {
                        try { localStorage.setItem(GAS_URL_STORAGE_KEY, decoded); } catch (e) { /* ignore */ }
                        return decoded;
                    }
                }
            } catch (e) { /* ignore */ }
            try {
                const stored = localStorage.getItem(GAS_URL_STORAGE_KEY);
                if (stored && stored.trim()) return stored.trim();
            } catch (e) { /* ignore */ }
            return "";
        };

        const normalizeGasUrl = (raw) => {
            let s = String(raw || "").trim();
            if (!s) return "";
            if (!/^https?:\/\//i.test(s)) s = "https://" + s;
            return s.replace(/\/+$/, "");
        };

        const isLikelyGasWebAppUrl = (url) =>
            /script\.google\.com\/macros\/s\//i.test(url) && /\/exec$/i.test(url);

        /** 目前頁面網址 + ?gas=… 供分享；開啟時 readInitialGasUrl 會讀取並寫入 localStorage。 */
        const buildShareableChartUrl = (gasWebAppUrl) => {
            const norm = normalizeGasUrl(gasWebAppUrl);
            if (!norm) return "";
            try {
                const u = new URL(window.location.href);
                u.searchParams.set("gas", norm);
                return u.toString();
            } catch (e) {
                return "";
            }
        };

        const DEFAULT_EDIT_PASSWORD = "6669";
        const ADMIN_PREFS_STORAGE_KEY = "monica-npi-admin-prefs";

        // Use Taiwan timezone (GMT+8 / Asia/Taipei) for default "today" anchor.
        const getTaiwanTodayNoon = () => {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            let year = 1970, month = 1, day = 1;
            for (const part of parts) {
                if (part.type === 'year') year = parseInt(part.value, 10);
                if (part.type === 'month') month = parseInt(part.value, 10);
                if (part.type === 'day') day = parseInt(part.value, 10);
            }
            return new Date(year, month - 1, day, 12, 0, 0);
        };

        const DEFAULT_VISIBLE_DAYS_BEFORE = 7;
        const DEFAULT_VISIBLE_DAYS_AFTER = 90;

        const INITIAL_SERIES_LIST = ['Gen10', 'Gen11', 'Gen12 AMD', 'Gen12 Intel'];
        const INITIAL_SITE_LIST = ['MX', 'LZ', 'MY', 'CZ', 'TN'];
        const DEFAULT_PICS = ['Sherry', 'Nick', 'Lambert', 'Rex'];

        const CATEGORY_TAG_STYLE = {
            'Gen10': 'bg-slate-300 text-slate-800 border-slate-400',
            'Gen11': 'bg-blue-200 text-blue-800 border-blue-300',
            'Gen12 AMD': 'bg-red-200 text-red-800 border-red-300',
            'Gen12 Intel': 'bg-cyan-200 text-cyan-800 border-cyan-300'
        };

        const seriesTagClass = (name) => CATEGORY_TAG_STYLE[name] || 'bg-slate-200 text-slate-800 border-slate-300';

        const normalizeLabelList = (arr) => {
            const seen = new Set();
            const out = [];
            (Array.isArray(arr) ? arr : []).forEach((raw) => {
                const s = String(raw || "").trim();
                if (!s || s.length > 120 || seen.has(s)) return;
                seen.add(s);
                out.push(s);
            });
            return out;
        };

        const readInitialAdminPrefs = () => {
            const fallback = {
                editPassword: DEFAULT_EDIT_PASSWORD,
                visibleDaysBefore: DEFAULT_VISIBLE_DAYS_BEFORE,
                visibleDaysAfter: DEFAULT_VISIBLE_DAYS_AFTER,
                resourceCheckEnabled: false,
                seriesList: [...INITIAL_SERIES_LIST],
                siteList: [...INITIAL_SITE_LIST]
            };
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return fallback;
                const p = JSON.parse(raw);
                const clampInt = (v, def, min, max) => {
                    const n = parseInt(v, 10);
                    if (!Number.isFinite(n)) return def;
                    return Math.min(max, Math.max(min, n));
                };
                let seriesList = normalizeLabelList(p.seriesList);
                let siteList = normalizeLabelList(p.siteList);
                if (!seriesList.length && Array.isArray(p.defaultCategories) && p.defaultCategories.length) {
                    seriesList = normalizeLabelList(p.defaultCategories);
                }
                if (!siteList.length && Array.isArray(p.defaultSites) && p.defaultSites.length) {
                    siteList = normalizeLabelList(p.defaultSites);
                }
                if (!seriesList.length) seriesList = [...fallback.seriesList];
                if (!siteList.length) siteList = [...fallback.siteList];
                return {
                    editPassword: typeof p.editPassword === "string" && p.editPassword.trim() ? p.editPassword.trim() : fallback.editPassword,
                    visibleDaysBefore: clampInt(p.visibleDaysBefore, fallback.visibleDaysBefore, 0, 730),
                    visibleDaysAfter: clampInt(p.visibleDaysAfter, fallback.visibleDaysAfter, 0, 730),
                    resourceCheckEnabled: p.resourceCheckEnabled === true,
                    seriesList,
                    siteList
                };
            } catch (e) {
                return fallback;
            }
        };
        
        const TYPE_COLORS = {
            DevelopmentTNRS: { bg: "bg-yellow-400", border: "border-yellow-600", label: "Development (TN-RS)" },
            DevelopmentPI: { bg: "bg-orange-500", border: "border-orange-700", label: "Development (PI) & Pre-golden start" },
            PreGolden: { bg: "bg-blue-500", border: "border-blue-700", label: "Pre-golden Validation" },
            GoldenFPY: { bg: "bg-green-500", border: "border-green-700", label: "Golden FPY" },
            VB: { bg: "bg-amber-700", border: "border-amber-900", label: "VB" }
        };

        const TYPE_MAPPER = {
            "Dev": "DevelopmentTNRS", "Development": "DevelopmentTNRS", "Development (TN-RS)": "DevelopmentTNRS", "DevelopmentTNRS": "DevelopmentTNRS",
            "Development (PI)": "DevelopmentPI", "Development (PI) & Pre-golden start": "DevelopmentPI", "PI": "DevelopmentPI", "DevelopmentPI": "DevelopmentPI",
            "Fine tune": "PreGolden", "Tuning": "PreGolden", "Verification": "PreGolden", 
            "Pre-golden (fine tune)": "PreGolden", "PreGolden": "PreGolden",
            "Pre-golden Validation": "PreGolden",
            "FPY": "GoldenFPY", "Golden Run": "GoldenFPY", "Golden FPY rack": "GoldenFPY", "GoldenFPY": "GoldenFPY",
            "Golden FPY": "GoldenFPY",
            "VB": "VB", "V/B": "VB"
        };

        // --- SVG icon component ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                database: <g><path d="M3 5V19C3 20.1 5.24 21 8 21C10.76 21 13 20.1 13 19V5M3 5C3 6.1 5.24 7 8 7C10.76 7 13 6.1 13 5M3 5C3 3.9 5.24 3 8 3C10.76 3 13 3.9 13 5M13 12C13 13.1 15.24 14 18 14C20.76 14 23 13.1 23 12M13 12C13 10.9 15.24 10 18 10C20.76 10 23 10.9 23 12M13 12V19C13 20.1 15.24 21 18 21C20.76 21 23 20.1 23 19V12" /></g>,
                lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                key: <g><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3L15.5 7.5z"/></g>,
                user: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></g>,
                "map-pin": <g><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></g>,
                "chevron-down": <polyline points="6 9 12 15 18 9" />,
                "chevron-right": <polyline points="9 18 15 12 9 6" />,
                "folder-open": <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2" />,
                "edit-2": <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                "refresh-cw": <g><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></g>,
                plus: <g><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></g>,
                x: <g><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></g>,
                spreadsheet: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="9" y1="3" x2="9" y2="21" /><line x1="15" y1="3" x2="15" y2="21" /></g>,
                link: <g><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></g>,
                settings: <g><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- Helper functions ---
        const formatText = (val) => {
            if (val === null || val === undefined) return "";
            if (typeof val === 'object') return "[Data]";
            return String(val);
        };

        const formatDate = (dateStr) => String(dateStr || "").split('T')[0];

        const isHoliday = (date) => {
            if (!date) return false;
            const d = date.getDay();
            const m = date.getMonth();
            const dayNum = date.getDate();
            return (d === 0 || d === 6) || (m === 4 && dayNum === 1);
        };

        const dateToNum = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();

        const strToNum = (s) => {
            const p = String(s || "").split('T')[0].split('-');
            if (p.length < 3) return 0;
            return parseInt(p[0]) * 10000 + parseInt(p[1]) * 100 + parseInt(p[2]);
        };

        const normalizeTypeKey = (rawType) => {
            const raw = formatText(rawType).trim();
            if (!raw) return "DevelopmentTNRS";
            if (TYPE_COLORS[raw]) return raw;
            if (TYPE_MAPPER[raw]) return TYPE_MAPPER[raw];

            const lower = raw.toLowerCase();
            if (lower.includes('pi')) return "DevelopmentPI";
            if (lower.includes('pre-golden')) return "PreGolden";
            if (lower.includes('golden')) return "GoldenFPY";
            if (lower.includes('vb') || lower.includes('v/b')) return "VB";
            if (lower.includes('dev')) return "DevelopmentTNRS";
            return "DevelopmentTNRS";
        };

        const FilterGroup = ({ label, options, selectedList, toggleFn, colorClass }) => (
            <div className="flex items-center gap-2 font-sans">
                <span className={`uppercase tracking-widest ${colorClass} shrink-0 font-bold text-[9px]`}>{label}</span>
                <div className="flex bg-slate-900/40 p-0.5 rounded-lg gap-0.5 border border-slate-700/30">
                    <button 
                        onClick={() => toggleFn('All')} 
                        className={`px-2.5 py-0.5 rounded text-[10px] font-black transition-all ${selectedList.length === 0 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}
                    >
                        All
                    </button>
                    {options.map(opt => (
                        <button 
                            key={opt} 
                            onClick={() => toggleFn(opt)} 
                            className={`px-2.5 py-0.5 rounded text-[10px] font-black transition-all border ${selectedList.includes(opt) ? 'bg-white text-slate-900 border-white shadow-sm' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                        >
                            {opt}
                        </button>
                    ))}
                </div>
            </div>
        );

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [isEditMode, setIsEditMode] = useState(false);
            const [isResourceCheckEnabled, setIsResourceCheckEnabled] = useState(() => readInitialAdminPrefs().resourceCheckEnabled === true);
            const [syncStatus, setSyncStatus] = useState('connecting');
            const [errorMsg, setErrorMsg] = useState(null);
            
            const [selectedSeries, setSelectedSeries] = useState([]);
            const [selectedSites, setSelectedSites] = useState([]);
            const [selectedPics, setSelectedPics] = useState([]);
            const [collapsedSeries, setCollapsedSeries] = useState({});
            const [showModal, setShowModal] = useState(false);
            const [modalData, setModalData] = useState(() => {
                const p = readInitialAdminPrefs();
                return { project: "", category: p.seriesList[0] || "", pic: DEFAULT_PICS[0] || "", site: p.siteList[0] || "", phases: [] };
            });
            const [originalProjectName, setOriginalProjectName] = useState(null);

            const [editPassword, setEditPassword] = useState(() => readInitialAdminPrefs().editPassword);
            const [visibleDaysBefore, setVisibleDaysBefore] = useState(() => readInitialAdminPrefs().visibleDaysBefore);
            const [visibleDaysAfter, setVisibleDaysAfter] = useState(() => readInitialAdminPrefs().visibleDaysAfter);

            const [seriesList, setSeriesList] = useState(() => readInitialAdminPrefs().seriesList);
            const [siteList, setSiteList] = useState(() => readInitialAdminPrefs().siteList);
            const [newSeriesInput, setNewSeriesInput] = useState("");
            const [newSiteInput, setNewSiteInput] = useState("");
            const [labelsTabErr, setLabelsTabErr] = useState("");
            const [labelsTabMsg, setLabelsTabMsg] = useState("");

            const initialGasUrl = useMemo(() => readInitialGasUrl(), []);
            const [gasUrl, setGasUrl] = useState(initialGasUrl);
            const [showSettingsModal, setShowSettingsModal] = useState(() => !normalizeGasUrl(initialGasUrl));
            const [settingsTab, setSettingsTab] = useState(() => (!normalizeGasUrl(initialGasUrl) ? "gas" : "display"));
            const [gasUrlDraft, setGasUrlDraft] = useState(() => initialGasUrl || "");
            const [settingsUrlError, setSettingsUrlError] = useState("");
            const [settingsTestOk, setSettingsTestOk] = useState("");
            const [shareLinkCopyMsg, setShareLinkCopyMsg] = useState("");
            const [headerShareLinkToast, setHeaderShareLinkToast] = useState("");
            const [editPassDraft, setEditPassDraft] = useState(() => readInitialAdminPrefs().editPassword);
            const [unlockPassInput, setUnlockPassInput] = useState("");
            const [unlockError, setUnlockError] = useState(false);
            const [adminPassMsg, setAdminPassMsg] = useState("");
            const [visibleDaysBeforeDraft, setVisibleDaysBeforeDraft] = useState(() => String(readInitialAdminPrefs().visibleDaysBefore));
            const [visibleDaysAfterDraft, setVisibleDaysAfterDraft] = useState(() => String(readInitialAdminPrefs().visibleDaysAfter));
            const [displaySaveMsg, setDisplaySaveMsg] = useState("");
            const [displaySaveErr, setDisplaySaveErr] = useState("");

            const dynamicOptions = useMemo(() => {
                const cats = new Set(seriesList);
                const sites = new Set(siteList);
                const pics = new Set(DEFAULT_PICS);
                tasks.forEach(t => {
                    const c = formatText(t.category).trim(), s = formatText(t.site).trim(), p = formatText(t.pic).trim();
                    if (c) cats.add(c);
                    if (s) sites.add(s);
                    if (p) p.split(/[/,，&]/).forEach(n => n.trim() && pics.add(n.trim()));
                });
                return { categories: Array.from(cats).sort(), sites: Array.from(sites).sort(), pics: Array.from(pics).sort() };
            }, [tasks, seriesList, siteList]);

            const persistAdminSnapshot = useCallback((overrides = {}) => {
                const snap = {
                    editPassword: overrides.editPassword !== undefined ? overrides.editPassword : editPassword,
                    visibleDaysBefore: overrides.visibleDaysBefore !== undefined ? overrides.visibleDaysBefore : visibleDaysBefore,
                    visibleDaysAfter: overrides.visibleDaysAfter !== undefined ? overrides.visibleDaysAfter : visibleDaysAfter,
                    resourceCheckEnabled: overrides.resourceCheckEnabled !== undefined ? overrides.resourceCheckEnabled : isResourceCheckEnabled,
                    seriesList: overrides.seriesList !== undefined ? overrides.seriesList : seriesList,
                    siteList: overrides.siteList !== undefined ? overrides.siteList : siteList
                };
                try { localStorage.setItem(ADMIN_PREFS_STORAGE_KEY, JSON.stringify(snap)); } catch (e) { /* ignore */ }
            }, [editPassword, visibleDaysBefore, visibleDaysAfter, isResourceCheckEnabled, seriesList, siteList]);

            const addSeriesItem = useCallback(() => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                const s = newSeriesInput.trim();
                if (!s) {
                    setLabelsTabErr("請輸入 Series 名稱。");
                    return;
                }
                if (s.length > 120) {
                    setLabelsTabErr("名稱不可超過 120 字元。");
                    return;
                }
                if (seriesList.includes(s)) {
                    setLabelsTabErr("此 Series 已存在。");
                    return;
                }
                const next = [...seriesList, s];
                setSeriesList(next);
                setNewSeriesInput("");
                persistAdminSnapshot({ seriesList: next });
                setLabelsTabMsg("已新增 Series。");
            }, [newSeriesInput, seriesList, persistAdminSnapshot]);

            const removeSeriesItem = useCallback((name) => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                if (seriesList.length <= 1) {
                    setLabelsTabErr("至少須保留一個 Series。");
                    return;
                }
                const next = seriesList.filter((x) => x !== name);
                setSeriesList(next);
                persistAdminSnapshot({ seriesList: next });
                setSelectedSeries((sel) => sel.filter((x) => x !== name));
                setCollapsedSeries((prev) => {
                    const cp = { ...prev };
                    delete cp[name];
                    return cp;
                });
                setModalData((md) => (md.category === name ? { ...md, category: next[0] || "" } : md));
                setLabelsTabMsg("已刪除 Series。");
            }, [seriesList, persistAdminSnapshot]);

            const addSiteItem = useCallback(() => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                const s = newSiteInput.trim();
                if (!s) {
                    setLabelsTabErr("請輸入 Site 代碼或名稱。");
                    return;
                }
                if (s.length > 120) {
                    setLabelsTabErr("名稱不可超過 120 字元。");
                    return;
                }
                if (siteList.includes(s)) {
                    setLabelsTabErr("此 Site 已存在。");
                    return;
                }
                const next = [...siteList, s];
                setSiteList(next);
                setNewSiteInput("");
                persistAdminSnapshot({ siteList: next });
                setLabelsTabMsg("已新增 Site。");
            }, [newSiteInput, siteList, persistAdminSnapshot]);

            const removeSiteItem = useCallback((name) => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                if (siteList.length <= 1) {
                    setLabelsTabErr("至少須保留一個 Site。");
                    return;
                }
                const next = siteList.filter((x) => x !== name);
                setSiteList(next);
                persistAdminSnapshot({ siteList: next });
                setSelectedSites((sel) => sel.filter((x) => x !== name));
                setModalData((md) => (md.site === name ? { ...md, site: next[0] || "" } : md));
                setLabelsTabMsg("已刪除 Site。");
            }, [siteList, persistAdminSnapshot]);

            const fetchFromSheets = useCallback(async () => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setTasks([]);
                    setErrorMsg("Set your Google Apps Script Web App URL in Settings → GAS URL tab.");
                    setSyncStatus('error');
                    return;
                }
                setSyncStatus('syncing');
                try {
                    const res = await fetch(base + "?t=" + Date.now());
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setTasks(data);
                        setSyncStatus('synced');
                        setErrorMsg(null);
                    } else {
                        setErrorMsg("Invalid response from cloud (expected JSON array).");
                        setSyncStatus('error');
                    }
                } catch (err) {
                    setErrorMsg("Cloud connection failed.");
                    setSyncStatus('error');
                }
            }, [gasUrl]);

            const handleSaveToCloud = async (updated) => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setErrorMsg("Set your Google Apps Script Web App URL in Settings → GAS URL tab.");
                    return;
                }
                setSyncStatus('syncing');
                try {
                    await fetch(base, {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify(updated)
                    });
                    setTimeout(fetchFromSheets, 4000);
                } catch (e) { setErrorMsg("Failed to save changes."); }
            };

            useEffect(() => { fetchFromSheets(); }, [fetchFromSheets]);

            const openSettingsModal = (tab) => {
                let t = "display";
                if (tab === "labels") t = "labels";
                else if (tab === "admin") t = "admin";
                else if (tab === "gas") t = "gas";
                else if (tab === "display") t = "display";
                setSettingsTab(t);
                setGasUrlDraft(gasUrl || "");
                setSettingsUrlError("");
                setSettingsTestOk("");
                setEditPassDraft(editPassword);
                setUnlockPassInput("");
                setUnlockError(false);
                setAdminPassMsg("");
                setDisplaySaveMsg("");
                setDisplaySaveErr("");
                setLabelsTabErr("");
                setLabelsTabMsg("");
                setShareLinkCopyMsg("");
                setHeaderShareLinkToast("");
                setVisibleDaysBeforeDraft(String(visibleDaysBefore));
                setVisibleDaysAfterDraft(String(visibleDaysAfter));
                setShowSettingsModal(true);
            };

            useEffect(() => {
                if (!normalizeGasUrl(gasUrl)) {
                    setShowSettingsModal(true);
                    setSettingsTab("gas");
                }
            }, [gasUrl]);

            const shareableChartUrl = useMemo(() => buildShareableChartUrl(gasUrl), [gasUrl]);

            const copyShareableChartUrl = useCallback(async (target = "settings") => {
                const url = buildShareableChartUrl(gasUrl);
                if (!url) {
                    if (target === "header") {
                        setHeaderShareLinkToast("請先完成 GAS URL 設定");
                        setTimeout(() => setHeaderShareLinkToast(""), 3000);
                    }
                    return;
                }
                try {
                    await navigator.clipboard.writeText(url);
                    if (target === "header") {
                        setHeaderShareLinkToast("已複製分享連結");
                        setTimeout(() => setHeaderShareLinkToast(""), 2500);
                    } else {
                        setShareLinkCopyMsg("已複製到剪貼簿");
                        setTimeout(() => setShareLinkCopyMsg(""), 2500);
                    }
                } catch (e) {
                    setShareLinkCopyMsg("");
                    setHeaderShareLinkToast("");
                    try {
                        window.prompt("請手動複製以下連結：", url);
                    } catch (_) { /* ignore */ }
                }
            }, [gasUrl]);

            const testDraftGasUrl = async () => {
                const normalized = normalizeGasUrl(gasUrlDraft);
                setSettingsTestOk("");
                if (!normalized) {
                    setSettingsUrlError("URL cannot be empty.");
                    return;
                }
                if (!isLikelyGasWebAppUrl(normalized)) {
                    setSettingsUrlError("Use the Web App URL ending in /exec (script.google.com/macros/s/.../exec).");
                    return;
                }
                setSettingsUrlError("");
                try {
                    const res = await fetch(normalized + "?t=" + Date.now());
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setSettingsTestOk(`OK: received ${data.length} row(s) from this URL (not saved yet).`);
                    } else {
                        setSettingsUrlError("Connected but response was not a JSON array.");
                    }
                } catch (e) {
                    setSettingsUrlError("Fetch failed: check URL and Web App deployment (Anyone / signed-in).");
                }
            };

            const applyGasUrlFromSettings = () => {
                const normalized = normalizeGasUrl(gasUrlDraft);
                if (!normalized) {
                    setSettingsUrlError("URL cannot be empty.");
                    return;
                }
                if (!isLikelyGasWebAppUrl(normalized)) {
                    setSettingsUrlError("Use the Web App URL ending in /exec (script.google.com/macros/s/.../exec).");
                    return;
                }
                try { localStorage.setItem(GAS_URL_STORAGE_KEY, normalized); } catch (e) { /* ignore */ }
                setGasUrl(normalized);
                setSettingsUrlError("");
                setSettingsTestOk("");
            };

            const resetGasUrlToDefault = () => {
                try { localStorage.removeItem(GAS_URL_STORAGE_KEY); } catch (e) { /* ignore */ }
                setGasUrl(DEFAULT_GAS_URL);
                setGasUrlDraft(DEFAULT_GAS_URL);
                setSettingsUrlError("");
                setSettingsTestOk("");
            };

            const saveEditPasscode = () => {
                const np = editPassDraft.trim();
                if (!np) {
                    setAdminPassMsg("Passcode cannot be empty.");
                    return;
                }
                setEditPassword(np);
                persistAdminSnapshot({ editPassword: np });
                setAdminPassMsg("Passcode saved for this browser.");
                setUnlockError(false);
            };

            const tryUnlockEditMode = () => {
                if (unlockPassInput === editPassword) {
                    setIsEditMode(true);
                    setUnlockError(false);
                    setUnlockPassInput("");
                } else {
                    setUnlockError(true);
                }
            };

            const saveVisibleDateRange = () => {
                setDisplaySaveErr("");
                setDisplaySaveMsg("");
                const before = parseInt(String(visibleDaysBeforeDraft).trim(), 10);
                const after = parseInt(String(visibleDaysAfterDraft).trim(), 10);
                if (!Number.isFinite(before) || !Number.isFinite(after)) {
                    setDisplaySaveErr("請輸入有效的整數天數。");
                    return;
                }
                if (before < 0 || after < 0 || before > 730 || after > 730) {
                    setDisplaySaveErr("天數須為 0～730 的整數。");
                    return;
                }
                setVisibleDaysBefore(before);
                setVisibleDaysAfter(after);
                persistAdminSnapshot({ visibleDaysBefore: before, visibleDaysAfter: after });
                setDisplaySaveMsg("可視範圍已儲存。");
            };

            const resetVisibleRangeDraftBuiltin = () => {
                setVisibleDaysBeforeDraft(String(DEFAULT_VISIBLE_DAYS_BEFORE));
                setVisibleDaysAfterDraft(String(DEFAULT_VISIBLE_DAYS_AFTER));
                setDisplaySaveErr("");
                setDisplaySaveMsg("已帶入內建預設（前 7 天、後 90 天），可按儲存套用。");
            };
            const handleFilterToggle = (list, setList, item) => {
                if (item === 'All') setList([]);
                else setList(prev => prev.includes(item) ? prev.filter(i => i !== item) : [...prev, item]);
            };

            const { days, taiwanToday } = useMemo(() => {
                const today = getTaiwanTodayNoon();
                const arr = [];
                const startLimit = new Date(today);
                startLimit.setDate(today.getDate() - visibleDaysBefore);
                const endLimit = new Date(today);
                endLimit.setDate(today.getDate() + visibleDaysAfter);
                let curr = new Date(startLimit);
                while (curr <= endLimit) {
                    arr.push(new Date(curr));
                    curr.setDate(curr.getDate() + 1);
                }
                return { days: arr, taiwanToday: today };
            }, [visibleDaysBefore, visibleDaysAfter]);

            const monthGroups = useMemo(() => {
                const groups = [];
                if (days.length === 0) return [];
                let curM = days[0].getMonth(), count = 0, startIdx = 0;
                days.forEach((day, i) => {
                    if (day.getMonth() === curM) count++;
                    else {
                        groups.push({ month: curM, count, year: days[startIdx].getFullYear() });
                        curM = day.getMonth(); count = 1; startIdx = i;
                    }
                });
                groups.push({ month: curM, count, year: days[startIdx].getFullYear() });
                return groups;
            }, [days]);

            const groupedData = useMemo(() => {
                const seriesFallback = seriesList[0] || "Unknown";
                const filtered = tasks.filter(t => {
                    const matchCat = selectedSeries.length === 0 || selectedSeries.includes(formatText(t.category));
                    const hasSite = selectedSites.length > 0, hasPic = selectedPics.length > 0;
                    let matchLoc = (hasSite ? selectedSites.includes(formatText(t.site)) : false) || 
                                   (hasPic ? selectedPics.some(p => formatText(t.pic).toLowerCase().includes(p.toLowerCase())) : false);
                    return matchCat && (!hasSite && !hasPic ? true : matchLoc);
                });
                const groups = {};
                dynamicOptions.categories.forEach(c => groups[c] = {});
                filtered.forEach(t => {
                    const c = formatText(t.category || seriesFallback), p = formatText(t.project || 'Unknown');
                    if (!groups[c]) groups[c] = {};
                    if (!groups[c][p]) groups[c][p] = [];
                    groups[c][p].push(t);
                });
                const result = [];
                dynamicOptions.categories.forEach(c => {
                    const ps = Object.entries(groups[c]).filter(e => e[1].length > 0).sort((a,b) => new Date(a[1][0].start) - new Date(b[1][0].start));
                    if (ps.length > 0) result.push({ category: c, projects: ps });
                });
                return result;
            }, [tasks, selectedSeries, selectedSites, selectedPics, dynamicOptions, seriesList]);

            const resourceOverloadSet = useMemo(() => {
                const trackedTypes = new Set(["DevelopmentTNRS", "DevelopmentPI"]);
                const overloaded = new Set();

                groupedData.forEach(group => {
                    days.forEach(day => {
                        if (isHoliday(day)) return;
                        const dateNum = dateToNum(day);
                        let activeDevProjectCount = 0;

                        group.projects.forEach(([, phases]) => {
                            const hasActiveDevPhase = phases.some(phase => {
                                const phaseType = normalizeTypeKey(phase.type);
                                return trackedTypes.has(phaseType) && dateNum >= strToNum(phase.start) && dateNum <= strToNum(phase.end);
                            });
                            if (hasActiveDevPhase) activeDevProjectCount += 1;
                        });

                        if (activeDevProjectCount > 2) {
                            overloaded.add(`${group.category}|${dateNum}`);
                        }
                    });
                });

                return overloaded;
            }, [groupedData, days]);

            return (
                <div className="flex flex-col h-screen overflow-hidden font-sans bg-slate-50">
                    {/* Header */}
                    <div className="bg-slate-900 text-white px-4 py-2 flex justify-between items-center shrink-0 border-b border-slate-800 shadow-md">
                        <div className="flex items-center gap-3">
                            <div className={`p-1.5 rounded-md ${syncStatus === 'synced' ? 'bg-green-600' : 'bg-orange-500 animate-pulse'}`}>
                                <Icon name="database" size={16} />
                            </div>
                            <div className="flex items-baseline gap-2 text-left font-black">
                                <h1 className="text-base font-black tracking-tighter uppercase underline decoration-green-500 underline-offset-4">Monica NPI Project Chart</h1>
                                <span className="text-[10px] text-slate-400 font-black italic tracking-widest">@Dixon Chu</span>
                            </div>
                        </div>
                        <div className="flex gap-2 items-center flex-wrap justify-end max-w-[min(100%,42rem)]">
                            <button
                                type="button"
                                onClick={() => setIsResourceCheckEnabled((prev) => {
                                    const next = !prev;
                                    setTimeout(() => persistAdminSnapshot({ resourceCheckEnabled: next }), 0);
                                    return next;
                                })}
                                className={`px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight ${isResourceCheckEnabled ? "bg-red-600 border-red-400 text-white" : "bg-slate-700 border-slate-600 hover:bg-slate-600"}`}
                            >
                                Resource Check: {isResourceCheckEnabled ? "ON" : "OFF"}
                            </button>
                            <button
                                type="button"
                                onClick={() => copyShareableChartUrl("header")}
                                className="px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight bg-violet-700 border-violet-500 hover:bg-violet-600 flex items-center gap-1"
                                title="複製目前頁面網址並附上 ?gas=（含現用 GAS Web App），方便分享給他人"
                            >
                                <Icon name="link" size={14} className="inline" /> 分享連結
                            </button>
                            {headerShareLinkToast ? (
                                <span className="text-[10px] font-black text-emerald-400 max-w-[10rem] leading-tight text-right shrink-0">{headerShareLinkToast}</span>
                            ) : null}
                            <button
                                type="button"
                                onClick={() => openSettingsModal()}
                                className="px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight bg-slate-700 border-slate-600 hover:bg-slate-600 flex items-center gap-1"
                                title="Settings: Display, Series & Site, Admin, GAS URL"
                            >
                                <Icon name="settings" size={14} className="inline" /> Settings
                            </button>
                            {isEditMode && (
                                <button
                                    type="button"
                                    onClick={() => setIsEditMode(false)}
                                    className="px-4 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg bg-orange-600 border-orange-400 text-white ring-2 ring-orange-500/20"
                                >
                                    <Icon name="x" size={12} className="inline mr-1" /> Finish editing
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Filters & Legend */}
                    <div className="bg-slate-800 border-b border-slate-700 px-4 py-1.5 space-y-1.5 shrink-0 text-[10px] font-black text-slate-300">
                        <FilterGroup label="SERIES" options={dynamicOptions.categories} selectedList={selectedSeries} toggleFn={(i)=>handleFilterToggle(selectedSeries, setSelectedSeries, i)} colorClass="text-indigo-400" />
                        <div className="flex flex-wrap gap-x-6 gap-y-1 border-t border-slate-700/50 pt-1.5 font-black">
                            <FilterGroup label="SITE" options={dynamicOptions.sites} selectedList={selectedSites} toggleFn={(i)=>handleFilterToggle(selectedSites, setSelectedSites, i)} colorClass="text-blue-400" />
                            <FilterGroup label="PIC" options={dynamicOptions.pics} selectedList={selectedPics} toggleFn={(i)=>handleFilterToggle(selectedPics, setSelectedPics, i)} colorClass="text-emerald-400" />
                        </div>
                        <div className="flex flex-wrap gap-4 pt-1.5 border-t border-slate-700/30 text-gray-300 font-black uppercase">
                            {Object.entries(TYPE_COLORS).map(([key, info]) => (
                                <div key={key} className="flex items-center gap-1 font-black">
                                    <div className={`w-2.5 h-2.5 rounded-sm ${info.bg} border ${info.border}`}></div> 
                                    <span className="uppercase tracking-tighter opacity-80">{info.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* New Project Control */}
                    {isEditMode && (
                        <div className="px-4 py-1.5 bg-white border-b border-gray-200 flex justify-end shrink-0 z-[400]">
                            <button onClick={() => { setOriginalProjectName(null); setModalData({ project: "", category: seriesList[0] || "", pic: DEFAULT_PICS[0] || "", site: siteList[0] || "", phases: [{ localId: Date.now(), task: "", type: "DevelopmentTNRS", start: formatDate(new Date()), end: formatDate(new Date()) }] }); setShowModal(true); }} className="bg-green-600 text-white px-4 py-1.5 rounded-md flex items-center gap-1 font-black shadow-md hover:bg-green-700 transition-all uppercase tracking-tighter font-sans">
                                <Icon name="plus" size={14} className="inline mr-1" /> New Project
                            </button>
                        </div>
                    )}

                    {/* Gantt Area */}
                    <div className="flex-1 overflow-auto custom-scrollbar relative bg-white pb-32 isolate">
                        <table className="w-full border-collapse table-fixed min-w-[1600px] text-left text-[12px]">
                            <thead className="sticky top-0 z-[300] shadow-sm font-sans bg-white">
                                <tr className="bg-slate-800 text-white text-[10px] font-black uppercase tracking-widest border-b border-slate-700">
                                    <th className="w-72 sticky left-0 z-[450] bg-slate-900 border-r border-slate-700 px-4 py-2 font-black font-sans uppercase">Timeline Scope</th>
                                    {monthGroups.map((group, idx) => (
                                        <th key={idx} colSpan={group.count} className="px-2 border-r border-slate-700 text-center bg-slate-800 uppercase font-black font-sans">
                                            {new Date(group.year, group.month).toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase()}
                                        </th>
                                    ))}
                                </tr>
                                <tr className="bg-white border-b border-gray-300 font-sans">
                                    <th className="w-72 sticky left-0 z-[450] bg-slate-100 border-r border-gray-300 h-8 font-black text-[9px] text-slate-500 px-4 uppercase tracking-tighter font-black font-sans">Project Portfolio</th>
                                    {days.map((day, i) => {
                                        const dateNum = dateToNum(day);
                                        const holiday = isHoliday(day);
                                        const isToday = dateNum === dateToNum(taiwanToday);
                                        return (
                                            <th key={i} className={`w-8 h-8 border-r border-gray-200 text-[9px] py-1 font-mono text-center ${holiday ? 'bg-slate-200 text-red-500 font-black' : 'text-slate-500'} ${isToday ? 'bg-red-50 text-red-600 border-x-red-400 font-black' : ''}`}>
                                                {day.getDate()}
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 relative">
                                {groupedData.map(group => {
                                    const isCollapsed = collapsedSeries[group.category];
                                    return (
                                        <React.Fragment key={group.category}>
                                            <tr className="bg-slate-100 border-y border-slate-300 cursor-pointer hover:bg-slate-200/80 select-none group z-10 relative font-black font-sans" onClick={() => setCollapsedSeries(prev => ({...prev, [group.category]: !isCollapsed}))}>
                                                <td className="sticky left-0 z-[50] bg-slate-100 px-3 py-1 font-black text-[11px] text-slate-800 flex items-center gap-2 shadow-[4px_0_8px_rgba(15,23,42,0.08)] border-r-2 border-slate-300">
                                                    <Icon name={isCollapsed ? "chevron-right" : "chevron-down"} size={12} />
                                                    <Icon name="folder-open" size={12} className="ml-1 text-blue-500" />
                                                    <span className="ml-1 font-black uppercase">{group.category}</span>
                                                    <span className="ml-2 text-[8px] px-2 py-0.5 bg-white rounded-full border border-slate-300 text-slate-500 font-bold">{group.projects.length} Items</span>
                                                </td>
                                                <td colSpan={days.length}></td>
                                            </tr>
                                            {!isCollapsed && group.projects.map(([projName, phases], projIdx) => {
                                                const projectHasResourceRisk = isResourceCheckEnabled && days.some(day => {
                                                    const dateNum = dateToNum(day);
                                                    if (!resourceOverloadSet.has(`${group.category}|${dateNum}`)) return false;
                                                    return phases.some(phase => {
                                                        const phaseType = normalizeTypeKey(phase.type);
                                                        const isDevType = phaseType === "DevelopmentTNRS" || phaseType === "DevelopmentPI";
                                                        return isDevType && dateNum >= strToNum(phase.start) && dateNum <= strToNum(phase.end);
                                                    });
                                                });

                                                return (
                                                <tr key={projName} className={`group/row relative transition-colors hover:z-[200] ${projectHasResourceRisk ? 'bg-red-50 hover:bg-red-100' : `hover:bg-sky-50 ${projIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}`}`}>
                                                    <td onClick={() => {if(isEditMode) {
                                                        setOriginalProjectName(projName);
                                                        setModalData({ project: projName, category: phases[0].category, pic: phases[0].pic, site: phases[0].site, phases: phases.map((p,idx)=>({...p, type: normalizeTypeKey(p.type), localId: Date.now()+idx})) });
                                                        setShowModal(true);
                                                    }}} className={`w-72 sticky left-0 z-[50] border-r-2 border-gray-300 py-1 px-4 shadow-[4px_0_8px_rgba(15,23,42,0.08)] ${projectHasResourceRisk ? 'bg-red-100 group-hover/row:bg-red-100 border-l-4 border-l-red-500' : `group-hover/row:bg-sky-100 ${projIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}`} ${isEditMode && !projectHasResourceRisk ? 'cursor-pointer border-l-4 border-l-orange-500 transition-all' : isEditMode ? 'cursor-pointer transition-all' : ''}`}>
                                                        <div className="flex flex-col gap-0.5 text-left font-black font-sans">
                                                            <div className="flex items-center justify-between font-black font-sans">
                                                                <span className={`text-[11px] truncate uppercase tracking-tight ${projectHasResourceRisk ? 'text-red-700' : 'text-gray-900'}`}>{projName}</span>
                                                                <div className="flex items-center gap-1">
                                                                    {isEditMode && <Icon name="edit-2" size={10} className="text-orange-500" />}
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 flex-wrap font-black font-sans">
                                                                <span className={`px-1.5 py-0.5 rounded-[2px] text-[7px] font-black border ${seriesTagClass(group.category)}`}>{group.category}</span>
                                                                <div className="flex items-center gap-1 text-blue-800 font-black text-[8px] bg-blue-100 px-1 rounded-sm border border-blue-200"><Icon name="user" size={8} /> {formatText(phases[0].pic)}</div>
                                                                <div className="flex items-center gap-1 text-slate-700 font-black text-[8px] bg-slate-200 px-1 rounded-sm border border-slate-300"><Icon name="map-pin" size={8} /> {formatText(phases[0].site)}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    {days.map((day, i) => {
                                                        const dateNum = dateToNum(day);
                                                        const active = phases.find(t => dateNum >= strToNum(t.start) && dateNum <= strToNum(t.end));
                                                        const holiday = isHoliday(day);
                                                        const isToday = dateNum === dateToNum(taiwanToday);
                                                        const typeKey = active ? normalizeTypeKey(active.type) : "";
                                                        const color = TYPE_COLORS[typeKey] || TYPE_COLORS.DevelopmentTNRS;
                                                        const isResourceOverloaded = isResourceCheckEnabled &&
                                                            active &&
                                                            (typeKey === "DevelopmentTNRS" || typeKey === "DevelopmentPI") &&
                                                            resourceOverloadSet.has(`${group.category}|${dateNum}`);

                                                        return (
                                                            <td key={i} className={`w-8 h-9 border-r border-gray-100 relative ${holiday ? 'bg-slate-200/50' : ''} ${isToday ? 'bg-red-100/30' : ''}`}>
                                                                {active && (
                                                                    <div className={`absolute inset-0 m-[1px] rounded-[2px] shadow-sm transition-all group/cell ${holiday ? 'opacity-40 grayscale-[0.3]' : 'opacity-95'} ${color.bg} hover:opacity-100 hover:scale-110 z-[30] border-b-2 border-black/10 ${isResourceOverloaded ? 'ring-2 ring-red-600 ring-offset-0 border border-red-700' : ''}`}>
                                                                        <div className="absolute hidden group-hover/cell:flex flex-col top-[110%] left-1/2 -translate-x-1/2 w-80 bg-slate-950 text-white p-3 rounded-lg shadow-2xl text-[10px] z-[9999] border border-slate-700 ring-4 ring-black/10 pointer-events-none font-sans">
                                                                            <div className="flex justify-between items-center border-b border-slate-700 pb-2 mb-2 font-black">
                                                                                <p className="font-black text-green-400 uppercase leading-none font-black">{color.label}</p>
                                                                                <p className="font-mono text-[9px] text-amber-400 font-bold leading-none whitespace-nowrap uppercase">
                                                                                    {formatDate(active.start)} ~ {formatDate(active.end)}
                                                                                </p>
                                                                            </div>
                                                                            <p className="opacity-100 font-semibold mb-1 break-words leading-relaxed font-black font-sans">{formatText(active.task)}</p>
                                                                            <p className="pt-1 border-t border-slate-800 text-[8px] text-slate-400 font-black uppercase tracking-tighter truncate">{projName}</p>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                                {isToday && <div className="absolute left-0 top-0 bottom-0 w-0.5 bg-red-600 z-10 opacity-60 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            )})}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Footer */}
                    <div className="bg-white border-t border-gray-200 px-4 py-2 text-[9px] flex justify-between items-center font-bold uppercase shrink-0">
                        <div className="flex items-center gap-2 text-slate-400 font-black">
                             <Icon name="spreadsheet" size={12} className="inline" /> 
                             <span>Cloud Storage Active</span>
                        </div>
                        <span className="text-slate-300 font-black italic">Persistent Matrix Link</span>
                    </div>

                    {/* Settings: Admin + Options */}
                    {showSettingsModal && (
                        <div className="fixed inset-0 z-[5500] flex items-center justify-center bg-slate-900/90 backdrop-blur-md p-4 font-sans font-black">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden border border-slate-200 flex flex-col text-left">
                                <div className="px-5 py-4 border-b border-slate-200 flex justify-between items-center gap-3 shrink-0 bg-slate-50">
                                    <div>
                                        <h3 className="text-base font-black text-slate-900 uppercase tracking-tight flex items-center gap-2">
                                            <Icon name="settings" size={20} className="text-blue-600" /> Settings
                                        </h3>

                                                                <button 
                                                                    key={key} 
                                                                    onClick={() => setModalData({...modalData, phases: modalData.phases.map(p => p.localId === phase.localId ? {...p, type: key} : p)})} 
                                                                    className={`px-2 py-1 rounded text-[8px] font-black border transition-all font-black font-black font-black ${phase.type === key ? `${info.bg} text-white border-transparent shadow-sm ring-1 ring-slate-400` : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'}`}
                                                                >
                                                                    {info.label}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">Start Date</label><input type="date" value={formatDate(phase.start)} onChange={e=>setModalData({...modalData, phases: modalData.phases.map(p=>p.localId===phase.localId?{...p, start: e.target.value}:p)})} className="w-full px-2 py-1 text-[11px] border rounded font-mono outline-none font-black font-sans font-black font-black font-black font-black" /></div>
                                                    <div className="font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">End Date</label><input type="date" value={formatDate(phase.end)} onChange={e=>setModalData({...modalData, phases: modalData.phases.map(p=>p.localId===phase.localId?{...p, end: e.target.value}:p)})} className="w-full px-2 py-1 text-[11px] border rounded font-mono outline-none font-black font-sans font-black font-black font-black font-black" /></div>
                                                </div>
                                                <button onClick={()=>setModalData({...modalData, phases: modalData.phases.filter(p=>p.localId!==phase.localId)})} className="p-2 text-red-300 hover:text-red-500 hover:bg-red-50 rounded transition-all font-black font-sans font-black font-black font-black font-black font-black font-black"><Icon name="x" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-4 pt-4 border-t font-black font-black font-black font-black font-black font-black font-black">
                                        {originalProjectName && <button onClick={()=>{if(window.confirm('Are you sure you want to delete this project?')){const updated=tasks.filter(t=>formatText(t.project)!==originalProjectName); setTasks(updated); handleSaveToCloud(updated); setShowModal(false);}}} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg font-black uppercase text-[10px] font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Delete Project</button>}
                                        <button onClick={()=>setShowModal(false)} className="px-5 py-2 text-slate-500 font-black ml-auto uppercase text-[10px] font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Cancel</button>
                                        <button onClick={()=>{
                                            let newTasks = [...tasks];
                                            if(originalProjectName) newTasks = newTasks.filter(t=>formatText(t.project)!==originalProjectName);
                                            const push = modalData.phases.map(p=>({project: modalData.project, category: modalData.category, pic: modalData.pic, site: modalData.site, task: p.task, type: normalizeTypeKey(p.type), start: p.start, end: p.end}));
                                            const final = [...newTasks, ...push];
                                            setTasks(final);
                                            handleSaveToCloud(final);
                                            setShowModal(false);
                                        }} className="px-10 py-2 bg-slate-900 text-white rounded-lg font-black uppercase text-[10px] shadow-lg hover:bg-slate-800 transition-all font-black font-sans font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Sync Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

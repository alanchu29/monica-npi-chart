<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monica NPI Project Chart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Enhanced scrollbar styles */
        .custom-scrollbar::-webkit-scrollbar { 
            width: 10px; 
            height: 14px; 
        }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: #f8fafc; 
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #64748b; 
            border-radius: 10px;
            border: 3px solid #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
            background: #3b82f6; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:active {
            background: #1d4ed8;
        }

        input:focus, select:focus { border-color: #3b82f6; ring: 2px #3b82f6; outline: none; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

        /* Settings modal：整體放大字級（一般 UI 仍維持原大小） */
        .settings-pane .text-\[9px\]  { font-size: 11px !important; line-height: 1.5 !important; }
        .settings-pane .text-\[10px\] { font-size: 12.5px !important; line-height: 1.55 !important; }
        .settings-pane .text-\[11px\] { font-size: 13px !important; line-height: 1.5 !important; }
        .settings-pane .text-\[12px\] { font-size: 14px !important; }
        .settings-pane .text-\[13px\] { font-size: 15px !important; }
        .settings-pane code             { font-size: 0.95em !important; }

    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans text-[12px]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbzT2YXUNxWbmpoJHm8lU7GuyN__eSrYkfFCSrM6Te3AlO0Lks9ds4z_1SUQpVbLYFyyvQ/exec";
        const GAS_URL_STORAGE_KEY = "monica-npi-gas-webapp-url";

        const readInitialGasUrl = () => {
            try {
                const q = new URLSearchParams(window.location.search).get("gas");
                if (q) {
                    const decoded = decodeURIComponent(q.trim());
                    if (decoded) {
                        try { localStorage.setItem(GAS_URL_STORAGE_KEY, decoded); } catch (e) { /* ignore */ }
                        return decoded;
                    }
                }
            } catch (e) { /* ignore */ }
            try {
                const stored = localStorage.getItem(GAS_URL_STORAGE_KEY);
                if (stored && stored.trim()) return stored.trim();
            } catch (e) { /* ignore */ }
            return "";
        };

        const normalizeGasUrl = (raw) => {
            let s = String(raw || "").trim();
            if (!s) return "";
            if (!/^https?:\/\//i.test(s)) s = "https://" + s;
            return s.replace(/\/+$/, "");
        };

        const isLikelyGasWebAppUrl = (url) =>
            /script\.google\.com\/macros\/s\//i.test(url) && /\/exec$/i.test(url);

        /** 目前頁面網址 + ?gas=… 供分享；開啟時 readInitialGasUrl 會讀取並寫入 localStorage。 */
        const buildShareableChartUrl = (gasWebAppUrl) => {
            const norm = normalizeGasUrl(gasWebAppUrl);
            if (!norm) return "";
            try {
                const u = new URL(window.location.href);
                u.searchParams.set("gas", norm);
                return u.toString();
            } catch (e) {
                return "";
            }
        };

        // 編輯模式密碼：預設無密碼（人人可解鎖）。實際的密碼由 GAS DocumentProperties 雲端共用，不存本機。
        const ADMIN_PREFS_STORAGE_KEY = "monica-npi-admin-prefs";

        // Use Taiwan timezone (GMT+8 / Asia/Taipei) for default "today" anchor.
        const getTaiwanTodayNoon = () => {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(new Date());
            let year = 1970, month = 1, day = 1;
            for (const part of parts) {
                if (part.type === 'year') year = parseInt(part.value, 10);
                if (part.type === 'month') month = parseInt(part.value, 10);
                if (part.type === 'day') day = parseInt(part.value, 10);
            }
            return new Date(year, month - 1, day, 12, 0, 0);
        };

        const DEFAULT_VISIBLE_DAYS_BEFORE = 7;
        const DEFAULT_VISIBLE_DAYS_AFTER = 90;
        const DEFAULT_CHART_TITLE = "Monica NPI Project Chart";

        /** 將使用者輸入的標題清理為適合送出的字串（去頭尾空白、單行、最多 120 字）。允許回傳空字串。 */
        const normalizeChartTitleInput = (raw) => {
            let s = String(raw ?? "").replace(/[\r\n]+/g, " ").trim();
            if (s.length > 120) s = s.slice(0, 120).trim();
            return s;
        };

        const INITIAL_SERIES_LIST = ['Gen10', 'Gen11', 'Gen12 AMD', 'Gen12 Intel'];
        const INITIAL_SITE_LIST = ['MX', 'LZ', 'MY', 'CZ', 'TN'];
        const DEFAULT_PICS = ['Sherry', 'Nick', 'Lambert', 'Rex'];

        const INITIAL_SERIES_COLORS = {
            'Gen10': '#cbd5e1',     // slate-300
            'Gen11': '#bfdbfe',     // blue-200
            'Gen12 AMD': '#fecaca', // red-200
            'Gen12 Intel': '#a5f3fc'// cyan-200
        };

        const INITIAL_PHASE_LIST = [
            { key: 'DevelopmentTNRS', label: 'Development (TN-RS)', color: '#facc15' },
            { key: 'DevelopmentPI',   label: 'Development (PI) & Pre-golden start', color: '#f97316' },
            { key: 'PreGolden',       label: 'Pre-golden Validation', color: '#3b82f6' },
            { key: 'GoldenFPY',       label: 'Golden FPY', color: '#22c55e' },
            { key: 'VB',              label: 'VB', color: '#b45309' }
        ];

        const DEFAULT_SERIES_COLOR = '#cbd5e1';
        const DEFAULT_PHASE_COLOR = '#94a3b8';

        // 新增 Series 時自動分配的調色盤
        const SERIES_COLOR_PALETTE = [
            '#bfdbfe', '#fecaca', '#a5f3fc', '#fef08a', '#bbf7d0',
            '#ddd6fe', '#fbcfe8', '#fed7aa', '#cffafe', '#e9d5ff'
        ];

        const parseHexColor = (raw, fallback = DEFAULT_SERIES_COLOR) => {
            const s = String(raw || '').trim();
            if (/^#[0-9a-fA-F]{6}$/.test(s)) return s.toLowerCase();
            if (/^#[0-9a-fA-F]{3}$/.test(s)) {
                const m = s.slice(1);
                return ('#' + m[0]+m[0] + m[1]+m[1] + m[2]+m[2]).toLowerCase();
            }
            return fallback;
        };

        const getReadableTextColor = (hex) => {
            const s = parseHexColor(hex, '#cbd5e1');
            const r = parseInt(s.slice(1,3), 16);
            const g = parseInt(s.slice(3,5), 16);
            const b = parseInt(s.slice(5,7), 16);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 140 ? '#0f172a' : '#ffffff';
        };

        const seriesTagStyle = (name, seriesColors) => {
            const bg = parseHexColor((seriesColors || {})[name], DEFAULT_SERIES_COLOR);
            return {
                backgroundColor: bg,
                color: getReadableTextColor(bg),
                borderColor: 'rgba(15,23,42,0.18)'
            };
        };

        const getPhaseInfo = (phaseList, key) => {
            if (Array.isArray(phaseList)) {
                const found = phaseList.find(p => p && p.key === key);
                if (found) return found;
                if (phaseList[0]) return phaseList[0];
            }
            return { key: key || 'phase', label: key || 'Phase', color: DEFAULT_PHASE_COLOR };
        };

        const makeUniquePhaseKey = (label, list) => {
            const taken = new Set((list || []).map(p => p.key));
            const base = String(label || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32) || 'phase';
            let candidate = base, i = 2;
            while (taken.has(candidate)) {
                candidate = base + i;
                i++;
            }
            return candidate;
        };

        const normalizeLabelList = (arr) => {
            const seen = new Set();
            const out = [];
            (Array.isArray(arr) ? arr : []).forEach((raw) => {
                const s = String(raw || "").trim();
                if (!s || s.length > 120 || seen.has(s)) return;
                seen.add(s);
                out.push(s);
            });
            return out;
        };

        const buildSeriesColors = (raw, names) => {
            const out = {};
            if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
                Object.entries(raw).forEach(([name, col]) => {
                    const trimmed = String(name || '').trim();
                    if (trimmed) out[trimmed] = parseHexColor(col, DEFAULT_SERIES_COLOR);
                });
            }
            (Array.isArray(names) ? names : []).forEach((name, idx) => {
                if (!out[name]) {
                    out[name] = INITIAL_SERIES_COLORS[name]
                        || SERIES_COLOR_PALETTE[idx % SERIES_COLOR_PALETTE.length];
                }
            });
            return out;
        };

        const buildPhaseList = (raw) => {
            if (!Array.isArray(raw)) return INITIAL_PHASE_LIST.map(p => ({ ...p }));
            const seen = new Set();
            const out = [];
            raw.forEach((item) => {
                if (!item || typeof item !== 'object') return;
                const key = String(item.key || '').trim();
                const label = String(item.label || '').replace(/[\r\n]+/g, ' ').trim();
                if (!key || !label) return;
                if (key.length > 60 || label.length > 120) return;
                if (seen.has(key)) return;
                seen.add(key);
                out.push({ key, label, color: parseHexColor(item.color, DEFAULT_PHASE_COLOR) });
            });
            if (!out.length) return INITIAL_PHASE_LIST.map(p => ({ ...p }));
            return out;
        };

        // 把任何來源的 labels payload 規範化為可用的 state
        const buildLabelsFromAny = (rawLabels) => {
            const src = rawLabels && typeof rawLabels === 'object' ? rawLabels : {};
            let seriesList = normalizeLabelList(src.seriesList);
            // 向下相容舊欄位
            if (!seriesList.length && Array.isArray(src.defaultCategories) && src.defaultCategories.length) {
                seriesList = normalizeLabelList(src.defaultCategories);
            }
            let siteList = normalizeLabelList(src.siteList);
            if (!siteList.length && Array.isArray(src.defaultSites) && src.defaultSites.length) {
                siteList = normalizeLabelList(src.defaultSites);
            }
            if (!seriesList.length) seriesList = [...INITIAL_SERIES_LIST];
            if (!siteList.length) siteList = [...INITIAL_SITE_LIST];
            return {
                seriesList,
                siteList,
                seriesColors: buildSeriesColors(src.seriesColors, seriesList),
                phaseList: buildPhaseList(src.phaseList)
            };
        };

        const hasMeaningfulLabels = (labels) => {
            if (!labels || typeof labels !== 'object') return false;
            return Array.isArray(labels.seriesList) && labels.seriesList.length > 0
                || Array.isArray(labels.phaseList) && labels.phaseList.length > 0
                || Array.isArray(labels.siteList) && labels.siteList.length > 0
                || (labels.seriesColors && Object.keys(labels.seriesColors).length > 0);
        };

        // 從本機 admin prefs 取出 legacy labels（一次性遷移用），找不到時回傳 null
        const readLegacyLabelData = () => {
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return null;
                const p = JSON.parse(raw);
                const hasAny = (Array.isArray(p.seriesList) && p.seriesList.length)
                    || (Array.isArray(p.siteList) && p.siteList.length)
                    || (Array.isArray(p.phaseList) && p.phaseList.length)
                    || (p.seriesColors && typeof p.seriesColors === 'object' && Object.keys(p.seriesColors).length)
                    || (Array.isArray(p.defaultCategories) && p.defaultCategories.length)
                    || (Array.isArray(p.defaultSites) && p.defaultSites.length);
                if (!hasAny) return null;
                return buildLabelsFromAny(p);
            } catch (e) {
                return null;
            }
        };

        // 清除本機 admin prefs 內的 label 欄位（保留其他 personal 設定）
        const clearLegacyLabelData = () => {
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                delete p.seriesList;
                delete p.siteList;
                delete p.seriesColors;
                delete p.phaseList;
                delete p.defaultCategories;
                delete p.defaultSites;
                localStorage.setItem(ADMIN_PREFS_STORAGE_KEY, JSON.stringify(p));
            } catch (e) { /* ignore */ }
        };

        // 從本機 admin prefs 取出 legacy editPassword（一次性遷移用），無/空白回傳 null
        const readLegacyEditPassword = () => {
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return null;
                const p = JSON.parse(raw);
                if (typeof p.editPassword !== 'string') return null;
                const trimmed = p.editPassword.trim();
                return trimmed ? trimmed : null;
            } catch (e) {
                return null;
            }
        };

        // 清除本機 admin prefs 內的 editPassword 欄位（保留其他 personal 設定）
        const clearLegacyEditPassword = () => {
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                delete p.editPassword;
                localStorage.setItem(ADMIN_PREFS_STORAGE_KEY, JSON.stringify(p));
            } catch (e) { /* ignore */ }
        };

        const readInitialAdminPrefs = () => {
            // 編輯密碼已改為雲端共用（GAS DocumentProperties），不再讀本機。
            // localStorage 僅保留個人偏好（可視天數、Resource Check）。
            const fallback = {
                visibleDaysBefore: DEFAULT_VISIBLE_DAYS_BEFORE,
                visibleDaysAfter: DEFAULT_VISIBLE_DAYS_AFTER,
                resourceCheckEnabled: false
            };
            try {
                const raw = localStorage.getItem(ADMIN_PREFS_STORAGE_KEY);
                if (!raw) return fallback;
                const p = JSON.parse(raw);
                const clampInt = (v, def, min, max) => {
                    const n = parseInt(v, 10);
                    if (!Number.isFinite(n)) return def;
                    return Math.min(max, Math.max(min, n));
                };
                return {
                    visibleDaysBefore: clampInt(p.visibleDaysBefore, fallback.visibleDaysBefore, 0, 730),
                    visibleDaysAfter: clampInt(p.visibleDaysAfter, fallback.visibleDaysAfter, 0, 730),
                    resourceCheckEnabled: p.resourceCheckEnabled === true
                };
            } catch (e) {
                return fallback;
            }
        };
        
        const TYPE_MAPPER = {
            "Dev": "DevelopmentTNRS", "Development": "DevelopmentTNRS", "Development (TN-RS)": "DevelopmentTNRS", "DevelopmentTNRS": "DevelopmentTNRS",
            "Development (PI)": "DevelopmentPI", "Development (PI) & Pre-golden start": "DevelopmentPI", "PI": "DevelopmentPI", "DevelopmentPI": "DevelopmentPI",
            "Fine tune": "PreGolden", "Tuning": "PreGolden", "Verification": "PreGolden", 
            "Pre-golden (fine tune)": "PreGolden", "PreGolden": "PreGolden",
            "Pre-golden Validation": "PreGolden",
            "FPY": "GoldenFPY", "Golden Run": "GoldenFPY", "Golden FPY rack": "GoldenFPY", "GoldenFPY": "GoldenFPY",
            "Golden FPY": "GoldenFPY",
            "VB": "VB", "V/B": "VB"
        };

        // --- SVG icon component ---
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                database: <g><path d="M3 5V19C3 20.1 5.24 21 8 21C10.76 21 13 20.1 13 19V5M3 5C3 6.1 5.24 7 8 7C10.76 7 13 6.1 13 5M3 5C3 3.9 5.24 3 8 3C10.76 3 13 3.9 13 5M13 12C13 13.1 15.24 14 18 14C20.76 14 23 13.1 23 12M13 12C13 10.9 15.24 10 18 10C20.76 10 23 10.9 23 12M13 12V19C13 20.1 15.24 21 18 21C20.76 21 23 20.1 23 19V12" /></g>,
                lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g>,
                key: <g><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3L15.5 7.5z"/></g>,
                user: <g><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></g>,
                "map-pin": <g><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></g>,
                "chevron-down": <polyline points="6 9 12 15 18 9" />,
                "chevron-right": <polyline points="9 18 15 12 9 6" />,
                "folder-open": <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2" />,
                "edit-2": <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                "refresh-cw": <g><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></g>,
                plus: <g><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></g>,
                x: <g><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></g>,
                spreadsheet: <g><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="9" y1="3" x2="9" y2="21" /><line x1="15" y1="3" x2="15" y2="21" /></g>,
                link: <g><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></g>,
                settings: <g><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></g>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        // --- Helper functions ---
        const formatText = (val) => {
            if (val === null || val === undefined) return "";
            if (typeof val === 'object') return "[Data]";
            return String(val);
        };

        const formatDate = (dateStr) => String(dateStr || "").split('T')[0];

        const isHoliday = (date) => {
            if (!date) return false;
            const d = date.getDay();
            const m = date.getMonth();
            const dayNum = date.getDate();
            return (d === 0 || d === 6) || (m === 4 && dayNum === 1);
        };

        const dateToNum = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();

        const strToNum = (s) => {
            const p = String(s || "").split('T')[0].split('-');
            if (p.length < 3) return 0;
            return parseInt(p[0]) * 10000 + parseInt(p[1]) * 100 + parseInt(p[2]);
        };

        const DEFAULT_PHASE_KEYS = INITIAL_PHASE_LIST.map(p => p.key);

        const normalizeTypeKey = (rawType, validKeys) => {
            const keys = (Array.isArray(validKeys) && validKeys.length) ? validKeys : DEFAULT_PHASE_KEYS;
            const valid = new Set(keys);
            const fallback = keys[0];
            const raw = formatText(rawType).trim();
            if (!raw) return fallback;
            if (valid.has(raw)) return raw;
            const mapped = TYPE_MAPPER[raw];
            if (mapped && valid.has(mapped)) return mapped;

            const lower = raw.toLowerCase();
            if (lower.includes('pi') && valid.has("DevelopmentPI")) return "DevelopmentPI";
            if (lower.includes('pre-golden') && valid.has("PreGolden")) return "PreGolden";
            if (lower.includes('golden') && valid.has("GoldenFPY")) return "GoldenFPY";
            if ((lower.includes('vb') || lower.includes('v/b')) && valid.has("VB")) return "VB";
            if (lower.includes('dev') && valid.has("DevelopmentTNRS")) return "DevelopmentTNRS";
            return fallback;
        };

        const FilterGroup = ({ label, options, selectedList, toggleFn, colorClass }) => (
            <div className="flex items-center gap-2 font-sans">
                <span className={`uppercase tracking-widest ${colorClass} shrink-0 font-bold text-[9px]`}>{label}</span>
                <div className="flex bg-slate-900/40 p-0.5 rounded-lg gap-0.5 border border-slate-700/30">
                    <button 
                        onClick={() => toggleFn('All')} 
                        className={`px-2.5 py-0.5 rounded text-[10px] font-black transition-all ${selectedList.length === 0 ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}
                    >
                        All
                    </button>
                    {options.map(opt => (
                        <button 
                            key={opt} 
                            onClick={() => toggleFn(opt)} 
                            className={`px-2.5 py-0.5 rounded text-[10px] font-black transition-all border ${selectedList.includes(opt) ? 'bg-white text-slate-900 border-white shadow-sm' : 'text-slate-500 border-transparent hover:text-slate-300'}`}
                        >
                            {opt}
                        </button>
                    ))}
                </div>
            </div>
        );

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [isEditMode, setIsEditMode] = useState(false);
            const [isResourceCheckEnabled, setIsResourceCheckEnabled] = useState(() => readInitialAdminPrefs().resourceCheckEnabled === true);
            const [syncStatus, setSyncStatus] = useState('connecting');
            const [errorMsg, setErrorMsg] = useState(null);
            
            const [selectedSeries, setSelectedSeries] = useState([]);
            const [selectedSites, setSelectedSites] = useState([]);
            const [selectedPics, setSelectedPics] = useState([]);
            const [collapsedSeries, setCollapsedSeries] = useState({});
            const [showModal, setShowModal] = useState(false);
            // seriesList / siteList 已改為雲端載入，初始 modalData 用內建預設；
            // 開新專案時 (見 "New Project" 按鈕) 會用當下最新的 seriesList / siteList 重設。
            const [modalData, setModalData] = useState(() => ({
                project: "",
                category: INITIAL_SERIES_LIST[0] || "",
                pic: DEFAULT_PICS[0] || "",
                site: INITIAL_SITE_LIST[0] || "",
                phases: []
            }));
            const [originalProjectName, setOriginalProjectName] = useState(null);

            // editPassword 改由 GAS 雲端管理，初始為空（無密碼）；等 fetchRemoteMeta() 回來再覆寫。
            const [editPassword, setEditPassword] = useState("");
            const [editPasswordLoaded, setEditPasswordLoaded] = useState(false);
            const legacyEditPasswordRef = useRef(readLegacyEditPassword());
            const [adminSyncMsg, setAdminSyncMsg] = useState("");
            const [visibleDaysBefore, setVisibleDaysBefore] = useState(() => readInitialAdminPrefs().visibleDaysBefore);
            const [visibleDaysAfter, setVisibleDaysAfter] = useState(() => readInitialAdminPrefs().visibleDaysAfter);
            const [remoteChartTitle, setRemoteChartTitle] = useState("");

            // Series / Phase / Site / 顏色：全部由雲端 (GAS DocumentProperties) 同步，
            // 啟動時先以內建預設填入，等 fetchRemoteMeta() 回來後覆寫。
            const [seriesList, setSeriesList] = useState(() => [...INITIAL_SERIES_LIST]);
            const [siteList, setSiteList] = useState(() => [...INITIAL_SITE_LIST]);
            const [seriesColors, setSeriesColors] = useState(() => buildSeriesColors(null, INITIAL_SERIES_LIST));
            const [phaseList, setPhaseList] = useState(() => INITIAL_PHASE_LIST.map(p => ({ ...p })));
            const [labelsLoaded, setLabelsLoaded] = useState(false); // true = 已從 GAS 取得 labels (或確認雲端為空)
            const legacyLabelsRef = useRef(readLegacyLabelData());   // 一次性 migration 用
            const [newSeriesInput, setNewSeriesInput] = useState("");
            const [newSiteInput, setNewSiteInput] = useState("");
            const [newPhaseLabel, setNewPhaseLabel] = useState("");
            const [newPhaseColor, setNewPhaseColor] = useState("#94a3b8");
            const [labelsTabErr, setLabelsTabErr] = useState("");
            const [labelsTabMsg, setLabelsTabMsg] = useState("");
            const [labelsSyncMsg, setLabelsSyncMsg] = useState(""); // migration / 同步狀態

            const phaseKeys = useMemo(() => phaseList.map(p => p.key), [phaseList]);

            const initialGasUrl = useMemo(() => readInitialGasUrl(), []);
            const [gasUrl, setGasUrl] = useState(initialGasUrl);
            const [showSettingsModal, setShowSettingsModal] = useState(() => !normalizeGasUrl(initialGasUrl));
            const [settingsTab, setSettingsTab] = useState(() => (!normalizeGasUrl(initialGasUrl) ? "gas" : "display"));
            const [gasUrlDraft, setGasUrlDraft] = useState(() => initialGasUrl || "");
            const [settingsUrlError, setSettingsUrlError] = useState("");
            const [settingsTestOk, setSettingsTestOk] = useState("");
            const [shareLinkCopyMsg, setShareLinkCopyMsg] = useState("");
            const [headerShareLinkToast, setHeaderShareLinkToast] = useState("");
            const [editPassDraft, setEditPassDraft] = useState("");
            const [adminPassMsg, setAdminPassMsg] = useState("");
            // Lock gate: 進入 Settings 與 Enable edit mode 共用的密碼驗證 modal。
            // intent 紀錄通過後要執行的動作（"settings" = 開設定、"edit" = 只解鎖編輯模式）。
            const [showLockGate, setShowLockGate] = useState(false);
            const [lockGateIntent, setLockGateIntent] = useState(null);
            const [lockGateInput, setLockGateInput] = useState("");
            const [lockGateError, setLockGateError] = useState(false);
            const [visibleDaysBeforeDraft, setVisibleDaysBeforeDraft] = useState(() => String(readInitialAdminPrefs().visibleDaysBefore));
            const [visibleDaysAfterDraft, setVisibleDaysAfterDraft] = useState(() => String(readInitialAdminPrefs().visibleDaysAfter));
            const [chartTitleDraft, setChartTitleDraft] = useState("");
            const [displaySaveMsg, setDisplaySaveMsg] = useState("");
            const [displaySaveErr, setDisplaySaveErr] = useState("");

            const dynamicOptions = useMemo(() => {
                const cats = new Set(seriesList);
                const sites = new Set(siteList);
                const pics = new Set(DEFAULT_PICS);
                tasks.forEach(t => {
                    const c = formatText(t.category).trim(), s = formatText(t.site).trim(), p = formatText(t.pic).trim();
                    if (c) cats.add(c);
                    if (s) sites.add(s);
                    if (p) p.split(/[/,，&]/).forEach(n => n.trim() && pics.add(n.trim()));
                });
                return { categories: Array.from(cats).sort(), sites: Array.from(sites).sort(), pics: Array.from(pics).sort() };
            }, [tasks, seriesList, siteList]);

            // localStorage 僅保留純個人偏好（可視天數、Resource Check）。
            // 編輯密碼、Series / Phase / Site / 顏色已改為雲端共用，見 saveEditPasswordToSheet / saveLabelsToSheet。
            const persistAdminSnapshot = useCallback((overrides = {}) => {
                const snap = {
                    visibleDaysBefore: overrides.visibleDaysBefore !== undefined ? overrides.visibleDaysBefore : visibleDaysBefore,
                    visibleDaysAfter: overrides.visibleDaysAfter !== undefined ? overrides.visibleDaysAfter : visibleDaysAfter,
                    resourceCheckEnabled: overrides.resourceCheckEnabled !== undefined ? overrides.resourceCheckEnabled : isResourceCheckEnabled
                };
                try { localStorage.setItem(ADMIN_PREFS_STORAGE_KEY, JSON.stringify(snap)); } catch (e) { /* ignore */ }
            }, [visibleDaysBefore, visibleDaysAfter, isResourceCheckEnabled]);

            // 推送編輯密碼到 GAS DocumentProperties（空字串 = 清除密碼，人人可解鎖）
            const saveEditPasswordToSheet = useCallback(async (newPassword) => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) return false;
                try {
                    await fetch(base, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "setEditPassword", password: String(newPassword == null ? "" : newPassword) })
                    });
                    return true;
                } catch (err) {
                    return false;
                }
            }, [gasUrl]);

            // 推送 Series / Phase / Site / 顏色 到 GAS DocumentProperties
            const saveLabelsToSheet = useCallback(async (overrides = {}) => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) return false;
                const payload = {
                    seriesList: overrides.seriesList !== undefined ? overrides.seriesList : seriesList,
                    siteList: overrides.siteList !== undefined ? overrides.siteList : siteList,
                    seriesColors: overrides.seriesColors !== undefined ? overrides.seriesColors : seriesColors,
                    phaseList: overrides.phaseList !== undefined ? overrides.phaseList : phaseList
                };
                try {
                    await fetch(base, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "setLabels", labels: payload })
                    });
                    return true;
                } catch (err) {
                    return false;
                }
            }, [gasUrl, seriesList, siteList, seriesColors, phaseList]);

            const effectiveChartTitle = useMemo(() => {
                const r = (remoteChartTitle || "").trim();
                return r || DEFAULT_CHART_TITLE;
            }, [remoteChartTitle]);

            const addSeriesItem = useCallback(() => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                const s = newSeriesInput.trim();
                if (!s) {
                    setLabelsTabErr("請輸入 Series 名稱。");
                    return;
                }
                if (s.length > 120) {
                    setLabelsTabErr("名稱不可超過 120 字元。");
                    return;
                }
                if (seriesList.includes(s)) {
                    setLabelsTabErr("此 Series 已存在。");
                    return;
                }
                const next = [...seriesList, s];
                const newColor = INITIAL_SERIES_COLORS[s]
                    || SERIES_COLOR_PALETTE[next.length % SERIES_COLOR_PALETTE.length];
                const nextColors = { ...seriesColors, [s]: parseHexColor(newColor, DEFAULT_SERIES_COLOR) };
                setSeriesList(next);
                setSeriesColors(nextColors);
                setNewSeriesInput("");
                saveLabelsToSheet({ seriesList: next, seriesColors: nextColors });
                setLabelsTabMsg("已新增 Series（已同步到雲端）。");
            }, [newSeriesInput, seriesList, seriesColors, saveLabelsToSheet]);

            const removeSeriesItem = useCallback((name) => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                if (seriesList.length <= 1) {
                    setLabelsTabErr("至少須保留一個 Series。");
                    return;
                }
                const next = seriesList.filter((x) => x !== name);
                const nextColors = { ...seriesColors };
                delete nextColors[name];
                setSeriesList(next);
                setSeriesColors(nextColors);
                saveLabelsToSheet({ seriesList: next, seriesColors: nextColors });
                setSelectedSeries((sel) => sel.filter((x) => x !== name));
                setCollapsedSeries((prev) => {
                    const cp = { ...prev };
                    delete cp[name];
                    return cp;
                });
                setModalData((md) => (md.category === name ? { ...md, category: next[0] || "" } : md));
                setLabelsTabMsg("已刪除 Series（已同步到雲端）。");
            }, [seriesList, seriesColors, saveLabelsToSheet]);

            const updateSeriesColor = useCallback((name, color) => {
                const hex = parseHexColor(color, DEFAULT_SERIES_COLOR);
                setSeriesColors((prev) => {
                    if (prev[name] === hex) return prev;
                    const next = { ...prev, [name]: hex };
                    saveLabelsToSheet({ seriesColors: next });
                    return next;
                });
            }, [saveLabelsToSheet]);

            const addPhaseItem = useCallback(() => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                const label = newPhaseLabel.trim();
                if (!label) {
                    setLabelsTabErr("請輸入 Phase 名稱。");
                    return;
                }
                if (label.length > 120) {
                    setLabelsTabErr("Phase 名稱不可超過 120 字元。");
                    return;
                }
                if (phaseList.some((p) => p.label === label)) {
                    setLabelsTabErr("已存在相同名稱的 Phase。");
                    return;
                }
                const key = makeUniquePhaseKey(label, phaseList);
                const next = [...phaseList, { key, label, color: parseHexColor(newPhaseColor, DEFAULT_PHASE_COLOR) }];
                setPhaseList(next);
                setNewPhaseLabel("");
                saveLabelsToSheet({ phaseList: next });
                setLabelsTabMsg("已新增 Phase（已同步到雲端）。");
            }, [newPhaseLabel, newPhaseColor, phaseList, saveLabelsToSheet]);

            const removePhaseItem = useCallback((key) => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                if (phaseList.length <= 1) {
                    setLabelsTabErr("至少須保留一個 Phase。");
                    return;
                }
                const next = phaseList.filter((p) => p.key !== key);
                const replacement = next[0].key;
                setPhaseList(next);
                saveLabelsToSheet({ phaseList: next });
                setModalData((md) => ({
                    ...md,
                    phases: (md.phases || []).map((p) => p.type === key ? { ...p, type: replacement } : p)
                }));
                setLabelsTabMsg("已刪除 Phase（已同步到雲端）。");
            }, [phaseList, saveLabelsToSheet]);

            const updatePhaseColor = useCallback((key, color) => {
                const hex = parseHexColor(color, DEFAULT_PHASE_COLOR);
                setPhaseList((prev) => {
                    const next = prev.map((p) => p.key === key ? { ...p, color: hex } : p);
                    saveLabelsToSheet({ phaseList: next });
                    return next;
                });
            }, [saveLabelsToSheet]);

            const updatePhaseLabel = useCallback((key, nextLabel) => {
                const trimmed = String(nextLabel || '').replace(/[\r\n]+/g, ' ').slice(0, 120);
                if (!trimmed.trim()) return;
                setPhaseList((prev) => {
                    const next = prev.map((p) => p.key === key ? { ...p, label: trimmed } : p);
                    saveLabelsToSheet({ phaseList: next });
                    return next;
                });
            }, [saveLabelsToSheet]);

            const addSiteItem = useCallback(() => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                const s = newSiteInput.trim();
                if (!s) {
                    setLabelsTabErr("請輸入 Site 代碼或名稱。");
                    return;
                }
                if (s.length > 120) {
                    setLabelsTabErr("名稱不可超過 120 字元。");
                    return;
                }
                if (siteList.includes(s)) {
                    setLabelsTabErr("此 Site 已存在。");
                    return;
                }
                const next = [...siteList, s];
                setSiteList(next);
                setNewSiteInput("");
                saveLabelsToSheet({ siteList: next });
                setLabelsTabMsg("已新增 Site（已同步到雲端）。");
            }, [newSiteInput, siteList, saveLabelsToSheet]);

            const removeSiteItem = useCallback((name) => {
                setLabelsTabErr("");
                setLabelsTabMsg("");
                if (siteList.length <= 1) {
                    setLabelsTabErr("至少須保留一個 Site。");
                    return;
                }
                const next = siteList.filter((x) => x !== name);
                setSiteList(next);
                saveLabelsToSheet({ siteList: next });
                setSelectedSites((sel) => sel.filter((x) => x !== name));
                setModalData((md) => (md.site === name ? { ...md, site: next[0] || "" } : md));
                setLabelsTabMsg("已刪除 Site（已同步到雲端）。");
            }, [siteList, saveLabelsToSheet]);

            const fetchFromSheets = useCallback(async () => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setTasks([]);
                    setErrorMsg("Set your Google Apps Script Web App URL in Settings → GAS URL tab.");
                    setSyncStatus('error');
                    return;
                }
                setSyncStatus('syncing');
                try {
                    const res = await fetch(base + "?t=" + Date.now());
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setTasks(data);
                        setSyncStatus('synced');
                        setErrorMsg(null);
                    } else {
                        setErrorMsg("Invalid response from cloud (expected JSON array).");
                        setSyncStatus('error');
                    }
                } catch (err) {
                    setErrorMsg("Cloud connection failed.");
                    setSyncStatus('error');
                }
            }, [gasUrl]);

            const fetchRemoteMeta = useCallback(async () => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setRemoteChartTitle("");
                    // 沒有 GAS URL 時不需要也無從雲端載入，視為「已載入」避免 UI 卡在 loading
                    setLabelsLoaded(true);
                    setEditPasswordLoaded(true);
                    return;
                }
                try {
                    const res = await fetch(base + "?meta=1&t=" + Date.now());
                    const data = await res.json();
                    if (!data || typeof data !== "object" || Array.isArray(data)) return;

                    if (typeof data.title === "string") {
                        setRemoteChartTitle(data.title.trim());
                    }

                    // 編輯密碼：雲端優先；雲端為空時若本機有 legacy 則一次性 migration
                    const remotePass = typeof data.editPassword === "string" ? data.editPassword : "";
                    if (remotePass) {
                        setEditPassword(remotePass);
                        setEditPasswordLoaded(true);
                        if (legacyEditPasswordRef.current) {
                            clearLegacyEditPassword();
                            legacyEditPasswordRef.current = null;
                        }
                    } else if (legacyEditPasswordRef.current) {
                        // 雲端沒有密碼 → 推上本機 legacy 密碼，保留本機直到下次確認
                        const legacy = legacyEditPasswordRef.current;
                        setEditPassword(legacy);
                        try {
                            await fetch(base, {
                                method: "POST",
                                mode: "no-cors",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({ action: "setEditPassword", password: legacy })
                            });
                            setAdminSyncMsg("已嘗試將本機編輯密碼上傳到雲端。請重新整理確認；若仍未生效，請確認 GAS 已部署支援 setEditPassword 的最新版本。");
                        } catch (err) {
                            setAdminSyncMsg("本機密碼上傳失敗，請確認 GAS 已部署最新版本後再試。");
                        }
                        setEditPasswordLoaded(true);
                    } else {
                        // 雲端 & 本機都沒有 → 預設無密碼
                        setEditPassword("");
                        setEditPasswordLoaded(true);
                    }

                    // Labels：雲端優先；雲端為空時若本機有 legacy 設定則一次性 migration
                    if (hasMeaningfulLabels(data.labels)) {
                        const built = buildLabelsFromAny(data.labels);
                        setSeriesList(built.seriesList);
                        setSiteList(built.siteList);
                        setSeriesColors(built.seriesColors);
                        setPhaseList(built.phaseList);
                        setLabelsLoaded(true);
                        // 雲端已有資料 = 確認同步成功，清除本機殘留
                        if (legacyLabelsRef.current) {
                            clearLegacyLabelData();
                            legacyLabelsRef.current = null;
                            setLabelsSyncMsg("已成功從雲端載入 Series / Phase / Site 設定（本機備份已清除）。");
                        }
                    } else if (legacyLabelsRef.current) {
                        // 雲端沒有 → 用本機 legacy 套上 state 並嘗試上推；保留本機直到下次重整確認
                        const built = buildLabelsFromAny(legacyLabelsRef.current);
                        setSeriesList(built.seriesList);
                        setSiteList(built.siteList);
                        setSeriesColors(built.seriesColors);
                        setPhaseList(built.phaseList);
                        try {
                            await fetch(base, {
                                method: "POST",
                                mode: "no-cors",
                                headers: { "Content-Type": "text/plain;charset=utf-8" },
                                body: JSON.stringify({ action: "setLabels", labels: built })
                            });
                            setLabelsSyncMsg("已嘗試將本機 Series / Phase / Site 設定上傳到雲端。請重新整理確認；若仍未生效，請確認 GAS 已部署支援 setLabels 的最新版本。");
                        } catch (err) {
                            setLabelsSyncMsg("本機設定上傳失敗，請確認 GAS 已部署最新版本後再試。");
                        }
                        // 注意：本機 legacy 保留至下次 fetchRemoteMeta 確認雲端有資料才清除
                        setLabelsLoaded(true);
                    } else {
                        // 雲端與本機都沒有 → 維持內建預設
                        setLabelsLoaded(true);
                    }
                } catch (e) {
                    // 舊版 GAS 未實作 ?meta=1 或網路異常 → 使用內建預設並提示使用者
                    setLabelsLoaded(true);
                    setEditPasswordLoaded(true);
                    if (legacyLabelsRef.current) {
                        // 本機有 legacy → 直接套上做為 fallback（避免遺失）
                        const built = buildLabelsFromAny(legacyLabelsRef.current);
                        setSeriesList(built.seriesList);
                        setSiteList(built.siteList);
                        setSeriesColors(built.seriesColors);
                        setPhaseList(built.phaseList);
                        setLabelsSyncMsg("無法連線到 GAS metadata，已暫時套用本機備份。請確認 GAS 已部署最新版本（支援 ?meta=1 與 setLabels）。");
                    }
                    if (legacyEditPasswordRef.current) {
                        setEditPassword(legacyEditPasswordRef.current);
                        setAdminSyncMsg("無法連線到 GAS metadata，已暫時套用本機密碼。請確認 GAS 已部署最新版本後再試。");
                    }
                }
            }, [gasUrl]);

            const handleSaveToCloud = async (updated) => {
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setErrorMsg("Set your Google Apps Script Web App URL in Settings → GAS URL tab.");
                    return;
                }
                setSyncStatus('syncing');
                try {
                    await fetch(base, {
                        method: 'POST', mode: 'no-cors',
                        body: JSON.stringify(updated)
                    });
                    setTimeout(fetchFromSheets, 4000);
                } catch (e) { setErrorMsg("Failed to save changes."); }
            };

            useEffect(() => { fetchFromSheets(); }, [fetchFromSheets]);
            useEffect(() => { fetchRemoteMeta(); }, [fetchRemoteMeta]);

            useEffect(() => {
                document.title = effectiveChartTitle;
            }, [effectiveChartTitle]);

            const openSettingsModal = (tab) => {
                let t = "display";
                if (tab === "series" || tab === "labels") t = "series";
                else if (tab === "phase") t = "phase";
                else if (tab === "site") t = "site";
                else if (tab === "admin") t = "admin";
                else if (tab === "gas") t = "gas";
                else if (tab === "display") t = "display";
                setSettingsTab(t);
                setNewPhaseLabel("");
                setNewPhaseColor("#94a3b8");
                setGasUrlDraft(gasUrl || "");
                setSettingsUrlError("");
                setSettingsTestOk("");
                setEditPassDraft(editPassword);
                setAdminPassMsg("");
                setDisplaySaveMsg("");
                setDisplaySaveErr("");
                setLabelsTabErr("");
                setLabelsTabMsg("");
                setShareLinkCopyMsg("");
                setHeaderShareLinkToast("");
                setVisibleDaysBeforeDraft(String(visibleDaysBefore));
                setVisibleDaysAfterDraft(String(visibleDaysAfter));
                setChartTitleDraft(remoteChartTitle);
                setShowSettingsModal(true);
            };

            // 當 editPassword 從雲端載入完成時，若 admin 分頁的 draft 還是空字串
            // （= 使用者尚未打字），自動帶入雲端值方便 user 看見並可調整
            useEffect(() => {
                if (editPasswordLoaded && showSettingsModal && settingsTab === "admin" && !editPassDraft && editPassword) {
                    setEditPassDraft(editPassword);
                }
            }, [editPasswordLoaded, editPassword, settingsTab, showSettingsModal]);

            useEffect(() => {
                if (!normalizeGasUrl(gasUrl)) {
                    setShowSettingsModal(true);
                    setSettingsTab("gas");
                }
            }, [gasUrl]);

            const shareableChartUrl = useMemo(() => buildShareableChartUrl(gasUrl), [gasUrl]);

            const copyShareableChartUrl = useCallback(async (target = "settings") => {
                const url = buildShareableChartUrl(gasUrl);
                if (!url) {
                    if (target === "header") {
                        setHeaderShareLinkToast("請先完成 GAS URL 設定");
                        setTimeout(() => setHeaderShareLinkToast(""), 3000);
                    }
                    return;
                }
                try {
                    await navigator.clipboard.writeText(url);
                    if (target === "header") {
                        setHeaderShareLinkToast("已複製分享連結");
                        setTimeout(() => setHeaderShareLinkToast(""), 2500);
                    } else {
                        setShareLinkCopyMsg("已複製到剪貼簿");
                        setTimeout(() => setShareLinkCopyMsg(""), 2500);
                    }
                } catch (e) {
                    setShareLinkCopyMsg("");
                    setHeaderShareLinkToast("");
                    try {
                        window.prompt("請手動複製以下連結：", url);
                    } catch (_) { /* ignore */ }
                }
            }, [gasUrl]);

            const testDraftGasUrl = async () => {
                const normalized = normalizeGasUrl(gasUrlDraft);
                setSettingsTestOk("");
                if (!normalized) {
                    setSettingsUrlError("URL cannot be empty.");
                    return;
                }
                if (!isLikelyGasWebAppUrl(normalized)) {
                    setSettingsUrlError("Use the Web App URL ending in /exec (script.google.com/macros/s/.../exec).");
                    return;
                }
                setSettingsUrlError("");
                try {
                    const res = await fetch(normalized + "?t=" + Date.now());
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setSettingsTestOk(`OK: received ${data.length} row(s) from this URL (not saved yet).`);
                    } else {
                        setSettingsUrlError("Connected but response was not a JSON array.");
                    }
                } catch (e) {
                    setSettingsUrlError("Fetch failed: check URL and Web App deployment (Anyone / signed-in).");
                }
            };

            const applyGasUrlFromSettings = () => {
                const normalized = normalizeGasUrl(gasUrlDraft);
                if (!normalized) {
                    setSettingsUrlError("URL cannot be empty.");
                    return;
                }
                if (!isLikelyGasWebAppUrl(normalized)) {
                    setSettingsUrlError("Use the Web App URL ending in /exec (script.google.com/macros/s/.../exec).");
                    return;
                }
                try { localStorage.setItem(GAS_URL_STORAGE_KEY, normalized); } catch (e) { /* ignore */ }
                setGasUrl(normalized);
                setSettingsUrlError("");
                setSettingsTestOk("");
            };

            const resetGasUrlToDefault = () => {
                try { localStorage.removeItem(GAS_URL_STORAGE_KEY); } catch (e) { /* ignore */ }
                setGasUrl(DEFAULT_GAS_URL);
                setGasUrlDraft(DEFAULT_GAS_URL);
                setSettingsUrlError("");
                setSettingsTestOk("");
            };

            const saveEditPasscode = async () => {
                const np = editPassDraft.replace(/[\r\n]+/g, '').trim();
                if (np.length > 200) {
                    setAdminPassMsg("Passcode 不可超過 200 字元。");
                    return;
                }
                if (!normalizeGasUrl(gasUrl)) {
                    setAdminPassMsg("請先於 GAS URL 分頁設定 Web App URL，再儲存密碼。");
                    return;
                }
                setEditPassword(np);
                const ok = await saveEditPasswordToSheet(np);
                if (ok) {
                    setAdminPassMsg(np
                        ? "密碼已同步到 GAS（所有使用者重新整理後生效）。"
                        : "已清除雲端密碼（解鎖編輯模式將不再需要輸入密碼）。");
                    setAdminSyncMsg("");
                } else {
                    setAdminPassMsg("寫入雲端失敗，請確認 GAS 已部署支援 setEditPassword 的版本後再試。");
                }
                // 清掉本機殘留（已上傳）
                if (legacyEditPasswordRef.current) {
                    clearLegacyEditPassword();
                    legacyEditPasswordRef.current = null;
                }
            };

            // 進入 Settings / 啟用 Edit Mode 共用入口；雲端有密碼且尚未解鎖時跳出 Lock Gate。
            const requestUnlock = useCallback((intent) => {
                // 雲端密碼還沒從 GAS 載回來（且 GAS URL 已設）→ 還沒法判斷，先什麼都不做。
                // 對應按鈕已用 disabled 視覺呈現「載入中」，這裡只是安全網。
                if (!editPasswordLoaded && !!normalizeGasUrl(gasUrl)) return;

                // 雲端未設密碼：完全跳過密碼步驟，依 intent 直接執行對應動作，
                // 「開 Settings」不會順手把 isEditMode 打開（避免無意間進入編輯模式）。
                if (!editPassword) {
                    if (intent === "edit") setIsEditMode(true);
                    else if (intent === "settings") openSettingsModal();
                    return;
                }
                // 已在編輯模式（= 此 session 內已通過驗證）：直接執行動作，不再要密碼
                if (isEditMode) {
                    if (intent === "settings") openSettingsModal();
                    return;
                }
                // 雲端有密碼且尚未解鎖 → 跳出密碼 gate
                setLockGateIntent(intent);
                setLockGateInput("");
                setLockGateError(false);
                setShowLockGate(true);
            }, [isEditMode, editPassword, editPasswordLoaded, gasUrl]);

            const closeLockGate = useCallback(() => {
                setShowLockGate(false);
                setLockGateIntent(null);
                setLockGateInput("");
                setLockGateError(false);
            }, []);

            const submitLockGate = useCallback(() => {
                if (lockGateInput === editPassword) {
                    setIsEditMode(true);
                    const intent = lockGateIntent;
                    setShowLockGate(false);
                    setLockGateIntent(null);
                    setLockGateInput("");
                    setLockGateError(false);
                    if (intent === "settings") openSettingsModal();
                } else {
                    setLockGateError(true);
                }
            }, [lockGateInput, editPassword, lockGateIntent]);

            const saveVisibleDateRange = () => {
                setDisplaySaveErr("");
                setDisplaySaveMsg("");
                const before = parseInt(String(visibleDaysBeforeDraft).trim(), 10);
                const after = parseInt(String(visibleDaysAfterDraft).trim(), 10);
                if (!Number.isFinite(before) || !Number.isFinite(after)) {
                    setDisplaySaveErr("請輸入有效的整數天數。");
                    return;
                }
                if (before < 0 || after < 0 || before > 730 || after > 730) {
                    setDisplaySaveErr("天數須為 0～730 的整數。");
                    return;
                }
                setVisibleDaysBefore(before);
                setVisibleDaysAfter(after);
                persistAdminSnapshot({ visibleDaysBefore: before, visibleDaysAfter: after });
                setDisplaySaveMsg("可視範圍已儲存。");
            };

            const resetVisibleRangeDraftBuiltin = () => {
                setVisibleDaysBeforeDraft(String(DEFAULT_VISIBLE_DAYS_BEFORE));
                setVisibleDaysAfterDraft(String(DEFAULT_VISIBLE_DAYS_AFTER));
                setDisplaySaveErr("");
                setDisplaySaveMsg("已帶入內建預設（前 7 天、後 90 天），可按儲存套用。");
            };

            const saveChartTitleToSheet = async () => {
                setDisplaySaveErr("");
                setDisplaySaveMsg("");
                const base = normalizeGasUrl(gasUrl);
                if (!base) {
                    setDisplaySaveErr("尚未設定 GAS URL，無法寫入雲端。");
                    return;
                }
                const next = normalizeChartTitleInput(chartTitleDraft);
                if (!next) {
                    setDisplaySaveErr("標題不可為空白。");
                    return;
                }
                try {
                    await fetch(base, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ action: 'setTitle', title: next })
                    });
                    setRemoteChartTitle(next);
                    setChartTitleDraft(next);
                    setDisplaySaveMsg("標題已送至 Google 試算表（重新命名整本試算表；其他人重新整理後會看到）。");
                    setTimeout(() => { fetchRemoteMeta(); }, 3000);
                } catch (e) {
                    setDisplaySaveErr("寫入雲端失敗，請確認 GAS 已部署支援 setTitle 的版本後再試。");
                }
            };

            const refreshRemoteChartTitle = async () => {
                setDisplaySaveErr("");
                setDisplaySaveMsg("");
                await fetchRemoteMeta();
                setDisplaySaveMsg("已重新從試算表抓取最新標題與 Series/Phase/Site 設定（若仍空白，請確認 GAS 已部署支援 ?meta=1 的版本）。");
            };
            const handleFilterToggle = (list, setList, item) => {
                if (item === 'All') setList([]);
                else setList(prev => prev.includes(item) ? prev.filter(i => i !== item) : [...prev, item]);
            };

            const { days, taiwanToday } = useMemo(() => {
                const today = getTaiwanTodayNoon();
                const arr = [];
                const startLimit = new Date(today);
                startLimit.setDate(today.getDate() - visibleDaysBefore);
                const endLimit = new Date(today);
                endLimit.setDate(today.getDate() + visibleDaysAfter);
                let curr = new Date(startLimit);
                while (curr <= endLimit) {
                    arr.push(new Date(curr));
                    curr.setDate(curr.getDate() + 1);
                }
                return { days: arr, taiwanToday: today };
            }, [visibleDaysBefore, visibleDaysAfter]);

            const monthGroups = useMemo(() => {
                const groups = [];
                if (days.length === 0) return [];
                let curM = days[0].getMonth(), count = 0, startIdx = 0;
                days.forEach((day, i) => {
                    if (day.getMonth() === curM) count++;
                    else {
                        groups.push({ month: curM, count, year: days[startIdx].getFullYear() });
                        curM = day.getMonth(); count = 1; startIdx = i;
                    }
                });
                groups.push({ month: curM, count, year: days[startIdx].getFullYear() });
                return groups;
            }, [days]);

            const groupedData = useMemo(() => {
                const seriesFallback = seriesList[0] || "Unknown";
                const filtered = tasks.filter(t => {
                    const matchCat = selectedSeries.length === 0 || selectedSeries.includes(formatText(t.category));
                    const hasSite = selectedSites.length > 0, hasPic = selectedPics.length > 0;
                    let matchLoc = (hasSite ? selectedSites.includes(formatText(t.site)) : false) || 
                                   (hasPic ? selectedPics.some(p => formatText(t.pic).toLowerCase().includes(p.toLowerCase())) : false);
                    return matchCat && (!hasSite && !hasPic ? true : matchLoc);
                });
                const groups = {};
                dynamicOptions.categories.forEach(c => groups[c] = {});
                filtered.forEach(t => {
                    const c = formatText(t.category || seriesFallback), p = formatText(t.project || 'Unknown');
                    if (!groups[c]) groups[c] = {};
                    if (!groups[c][p]) groups[c][p] = [];
                    groups[c][p].push(t);
                });
                const result = [];
                dynamicOptions.categories.forEach(c => {
                    const ps = Object.entries(groups[c]).filter(e => e[1].length > 0).sort((a,b) => new Date(a[1][0].start) - new Date(b[1][0].start));
                    if (ps.length > 0) result.push({ category: c, projects: ps });
                });
                return result;
            }, [tasks, selectedSeries, selectedSites, selectedPics, dynamicOptions, seriesList]);

            const resourceOverloadSet = useMemo(() => {
                const trackedTypes = new Set(["DevelopmentTNRS", "DevelopmentPI"]);
                const overloaded = new Set();

                groupedData.forEach(group => {
                    days.forEach(day => {
                        if (isHoliday(day)) return;
                        const dateNum = dateToNum(day);
                        let activeDevProjectCount = 0;

                        group.projects.forEach(([, phases]) => {
                            const hasActiveDevPhase = phases.some(phase => {
                                const phaseType = normalizeTypeKey(phase.type, phaseKeys);
                                return trackedTypes.has(phaseType) && dateNum >= strToNum(phase.start) && dateNum <= strToNum(phase.end);
                            });
                            if (hasActiveDevPhase) activeDevProjectCount += 1;
                        });

                        if (activeDevProjectCount > 2) {
                            overloaded.add(`${group.category}|${dateNum}`);
                        }
                    });
                });

                return overloaded;
            }, [groupedData, days, phaseKeys]);

            return (
                <div className="flex flex-col h-screen overflow-hidden font-sans bg-slate-50">
                    {/* Header */}
                    <div className="bg-slate-900 text-white px-4 py-2 flex justify-between items-center shrink-0 border-b border-slate-800 shadow-md">
                        <div className="flex items-center gap-3 min-w-0 flex-1">
                            <div className={`p-1.5 rounded-md ${syncStatus === 'synced' ? 'bg-green-600' : 'bg-orange-500 animate-pulse'}`}>
                                <Icon name="database" size={16} />
                            </div>
                            <div className="flex items-baseline gap-2 text-left font-black min-w-0 flex-1 mr-2">
                                <h1 className="text-base font-black tracking-tighter uppercase underline decoration-green-500 underline-offset-4 truncate" title={effectiveChartTitle}>{effectiveChartTitle}</h1>
                                <span className="text-[10px] text-slate-400 font-black italic tracking-widest">@Dixon Chu</span>
                            </div>
                        </div>
                        <div className="flex gap-2 items-center flex-wrap justify-end max-w-[min(100%,42rem)]">
                            <button
                                type="button"
                                onClick={() => setIsResourceCheckEnabled((prev) => {
                                    const next = !prev;
                                    setTimeout(() => persistAdminSnapshot({ resourceCheckEnabled: next }), 0);
                                    return next;
                                })}
                                className={`px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight ${isResourceCheckEnabled ? "bg-red-600 border-red-400 text-white" : "bg-slate-700 border-slate-600 hover:bg-slate-600"}`}
                            >
                                Resource Check: {isResourceCheckEnabled ? "ON" : "OFF"}
                            </button>
                            <button
                                type="button"
                                onClick={() => copyShareableChartUrl("header")}
                                className="px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight bg-violet-700 border-violet-500 hover:bg-violet-600 flex items-center gap-1"
                                title="複製目前頁面網址並附上 ?gas=（含現用 GAS Web App），方便分享給他人"
                            >
                                <Icon name="link" size={14} className="inline" /> 分享連結
                            </button>
                            {headerShareLinkToast ? (
                                <span className="text-[10px] font-black text-emerald-400 max-w-[10rem] leading-tight text-right shrink-0">{headerShareLinkToast}</span>
                            ) : null}
                            <button
                                type="button"
                                onClick={() => requestUnlock("settings")}
                                disabled={!editPasswordLoaded && !!normalizeGasUrl(gasUrl)}
                                className={`px-3 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight flex items-center gap-1 ${(!editPasswordLoaded && !!normalizeGasUrl(gasUrl)) ? "bg-slate-800 border-slate-700 text-slate-400 cursor-wait" : "bg-slate-700 border-slate-600 hover:bg-slate-600"}`}
                                title={editPassword && !isEditMode ? "Settings 需要密碼解鎖" : "Settings: Display, Series & Site, Admin, GAS URL"}
                            >
                                <Icon name="settings" size={14} className="inline" /> Settings
                                {editPassword && !isEditMode && <Icon name="lock" size={12} className="inline ml-1 opacity-80" />}
                            </button>
                            {isEditMode ? (
                                <button
                                    type="button"
                                    onClick={() => setIsEditMode(false)}
                                    className="px-4 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg bg-orange-600 border-orange-400 text-white ring-2 ring-orange-500/20 uppercase tracking-tight flex items-center gap-1"
                                    title="退出編輯模式"
                                >
                                    <Icon name="x" size={12} className="inline" /> Finish editing
                                </button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={() => requestUnlock("edit")}
                                    disabled={!editPasswordLoaded && !!normalizeGasUrl(gasUrl)}
                                    className={`px-4 py-1.5 rounded font-black text-[11px] transition-all border shadow-lg uppercase tracking-tight flex items-center gap-1 ${(!editPasswordLoaded && !!normalizeGasUrl(gasUrl)) ? "bg-slate-700 border-slate-600 text-slate-400 cursor-wait" : "bg-emerald-600 border-emerald-400 text-white hover:bg-emerald-500"}`}
                                    title={editPassword ? "啟用編輯模式（需密碼）" : "啟用編輯模式"}
                                >
                                    <Icon name={editPassword ? "lock" : "edit-2"} size={12} className="inline" /> Enable edit mode
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Filters & Legend */}
                    <div className="bg-slate-800 border-b border-slate-700 px-4 py-1.5 space-y-1.5 shrink-0 text-[10px] font-black text-slate-300">
                        <FilterGroup label="SERIES" options={dynamicOptions.categories} selectedList={selectedSeries} toggleFn={(i)=>handleFilterToggle(selectedSeries, setSelectedSeries, i)} colorClass="text-indigo-400" />
                        <div className="flex flex-wrap gap-x-6 gap-y-1 border-t border-slate-700/50 pt-1.5 font-black">
                            <FilterGroup label="SITE" options={dynamicOptions.sites} selectedList={selectedSites} toggleFn={(i)=>handleFilterToggle(selectedSites, setSelectedSites, i)} colorClass="text-blue-400" />
                            <FilterGroup label="PIC" options={dynamicOptions.pics} selectedList={selectedPics} toggleFn={(i)=>handleFilterToggle(selectedPics, setSelectedPics, i)} colorClass="text-emerald-400" />
                        </div>
                        <div className="flex flex-wrap gap-4 pt-1.5 border-t border-slate-700/30 text-gray-300 font-black uppercase">
                            {phaseList.map((info) => (
                                <div key={info.key} className="flex items-center gap-1 font-black">
                                    <div className="w-2.5 h-2.5 rounded-sm border" style={{ backgroundColor: info.color, borderColor: 'rgba(15,23,42,0.4)' }}></div>
                                    <span className="uppercase tracking-tighter opacity-80">{info.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* New Project Control */}
                    {isEditMode && (
                        <div className="px-4 py-1.5 bg-white border-b border-gray-200 flex justify-end shrink-0 z-[400]">
                            <button onClick={() => { setOriginalProjectName(null); setModalData({ project: "", category: seriesList[0] || "", pic: DEFAULT_PICS[0] || "", site: siteList[0] || "", phases: [{ localId: Date.now(), task: "", type: "DevelopmentTNRS", start: formatDate(new Date()), end: formatDate(new Date()) }] }); setShowModal(true); }} className="bg-green-600 text-white px-4 py-1.5 rounded-md flex items-center gap-1 font-black shadow-md hover:bg-green-700 transition-all uppercase tracking-tighter font-sans">
                                <Icon name="plus" size={14} className="inline mr-1" /> New Project
                            </button>
                        </div>
                    )}

                    {/* Gantt Area */}
                    <div className="flex-1 overflow-auto custom-scrollbar relative bg-white pb-32 isolate">
                        <table className="w-full border-collapse table-fixed min-w-[1600px] text-left text-[12px]">
                            <thead className="sticky top-0 z-[300] shadow-sm font-sans bg-white">
                                <tr className="bg-slate-800 text-white text-[10px] font-black uppercase tracking-widest border-b border-slate-700">
                                    <th className="w-72 sticky left-0 z-[450] bg-slate-900 border-r border-slate-700 px-4 py-2 font-black font-sans uppercase">Timeline Scope</th>
                                    {monthGroups.map((group, idx) => (
                                        <th key={idx} colSpan={group.count} className="px-2 border-r border-slate-700 text-center bg-slate-800 uppercase font-black font-sans">
                                            {new Date(group.year, group.month).toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase()}
                                        </th>
                                    ))}
                                </tr>
                                <tr className="bg-white border-b border-gray-300 font-sans">
                                    <th className="w-72 sticky left-0 z-[450] bg-slate-100 border-r border-gray-300 h-8 font-black text-[9px] text-slate-500 px-4 uppercase tracking-tighter font-black font-sans">Project Portfolio</th>
                                    {days.map((day, i) => {
                                        const dateNum = dateToNum(day);
                                        const holiday = isHoliday(day);
                                        const isToday = dateNum === dateToNum(taiwanToday);
                                        return (
                                            <th key={i} className={`w-8 h-8 border-r border-gray-200 text-[9px] py-1 font-mono text-center ${holiday ? 'bg-slate-200 text-red-500 font-black' : 'text-slate-500'} ${isToday ? 'bg-red-50 text-red-600 border-x-red-400 font-black' : ''}`}>
                                                {day.getDate()}
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 relative">
                                {groupedData.map(group => {
                                    const isCollapsed = collapsedSeries[group.category];
                                    return (
                                        <React.Fragment key={group.category}>
                                            <tr className="bg-slate-100 border-y border-slate-300 cursor-pointer hover:bg-slate-200/80 select-none group z-10 relative font-black font-sans" onClick={() => setCollapsedSeries(prev => ({...prev, [group.category]: !isCollapsed}))}>
                                                <td className="sticky left-0 z-[50] bg-slate-100 px-3 py-1 font-black text-[11px] text-slate-800 flex items-center gap-2 shadow-[4px_0_8px_rgba(15,23,42,0.08)] border-r-2 border-slate-300">
                                                    <Icon name={isCollapsed ? "chevron-right" : "chevron-down"} size={12} />
                                                    <Icon name="folder-open" size={12} className="ml-1 text-blue-500" />
                                                    <span className="ml-1 font-black uppercase">{group.category}</span>
                                                    <span className="ml-2 text-[8px] px-2 py-0.5 bg-white rounded-full border border-slate-300 text-slate-500 font-bold">{group.projects.length} Items</span>
                                                </td>
                                                <td colSpan={days.length}></td>
                                            </tr>
                                            {!isCollapsed && group.projects.map(([projName, phases], projIdx) => {
                                                const projectHasResourceRisk = isResourceCheckEnabled && days.some(day => {
                                                    const dateNum = dateToNum(day);
                                                    if (!resourceOverloadSet.has(`${group.category}|${dateNum}`)) return false;
                                                    return phases.some(phase => {
                                                        const phaseType = normalizeTypeKey(phase.type, phaseKeys);
                                                        const isDevType = phaseType === "DevelopmentTNRS" || phaseType === "DevelopmentPI";
                                                        return isDevType && dateNum >= strToNum(phase.start) && dateNum <= strToNum(phase.end);
                                                    });
                                                });

                                                return (
                                                <tr key={projName} className={`group/row relative transition-colors hover:z-[200] ${projectHasResourceRisk ? 'bg-red-50 hover:bg-red-100' : `hover:bg-sky-50 ${projIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}`}`}>
                                                    <td onClick={() => {if(isEditMode) {
                                                        setOriginalProjectName(projName);
                                                        setModalData({ project: projName, category: phases[0].category, pic: phases[0].pic, site: phases[0].site, phases: phases.map((p,idx)=>({...p, type: normalizeTypeKey(p.type, phaseKeys), localId: Date.now()+idx})) });
                                                        setShowModal(true);
                                                    }}} className={`w-72 sticky left-0 z-[50] border-r-2 border-gray-300 py-1 px-4 shadow-[4px_0_8px_rgba(15,23,42,0.08)] ${projectHasResourceRisk ? 'bg-red-100 group-hover/row:bg-red-100 border-l-4 border-l-red-500' : `group-hover/row:bg-sky-100 ${projIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}`} ${isEditMode && !projectHasResourceRisk ? 'cursor-pointer border-l-4 border-l-orange-500 transition-all' : isEditMode ? 'cursor-pointer transition-all' : ''}`}>
                                                        <div className="flex flex-col gap-0.5 text-left font-black font-sans">
                                                            <div className="flex items-center justify-between font-black font-sans">
                                                                <span className={`text-[11px] truncate uppercase tracking-tight ${projectHasResourceRisk ? 'text-red-700' : 'text-gray-900'}`}>{projName}</span>

                                                                <div className="flex items-center gap-1">
                                                                    {isEditMode && <Icon name="edit-2" size={10} className="text-orange-500" />}
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 flex-wrap font-black font-sans">
                                                                <span className="px-1.5 py-0.5 rounded-[2px] text-[7px] font-black border" style={seriesTagStyle(group.category, seriesColors)}>{group.category}</span>
                                                                <div className="flex items-center gap-1 text-blue-800 font-black text-[8px] bg-blue-100 px-1 rounded-sm border border-blue-200"><Icon name="user" size={8} /> {formatText(phases[0].pic)}</div>
                                                                <div className="flex items-center gap-1 text-slate-700 font-black text-[8px] bg-slate-200 px-1 rounded-sm border border-slate-300"><Icon name="map-pin" size={8} /> {formatText(phases[0].site)}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    {days.map((day, i) => {
                                                        const dateNum = dateToNum(day);
                                                        const active = phases.find(t => dateNum >= strToNum(t.start) && dateNum <= strToNum(t.end));
                                                        const holiday = isHoliday(day);
                                                        const isToday = dateNum === dateToNum(taiwanToday);
                                                        const typeKey = active ? normalizeTypeKey(active.type, phaseKeys) : "";
                                                        const phaseInfo = getPhaseInfo(phaseList, typeKey);
                                                        const phaseColor = phaseInfo.color || DEFAULT_PHASE_COLOR;
                                                        const isResourceOverloaded = isResourceCheckEnabled &&
                                                            active &&
                                                            (typeKey === "DevelopmentTNRS" || typeKey === "DevelopmentPI") &&
                                                            resourceOverloadSet.has(`${group.category}|${dateNum}`);

                                                        return (
                                                            <td key={i} className={`w-8 h-9 border-r border-gray-100 relative ${holiday ? 'bg-slate-200/50' : ''} ${isToday ? 'bg-red-100/30' : ''}`}>
                                                                {active && (
                                                                    <div
                                                                        className={`absolute inset-0 m-[1px] rounded-[2px] shadow-sm transition-all group/cell ${holiday ? 'opacity-40 grayscale-[0.3]' : 'opacity-95'} hover:opacity-100 hover:scale-110 z-[30] border-b-2 border-black/10 ${isResourceOverloaded ? 'ring-2 ring-red-600 ring-offset-0 border border-red-700' : ''}`}
                                                                        style={{ backgroundColor: phaseColor }}
                                                                    >

                                            {!labelsLoaded && <p className="text-slate-500 text-[10px] font-bold">正在從 Google 試算表載入 Series / Phase / Site 設定…</p>}
                                            {labelsTabErr && <p className="text-red-600 text-[10px] font-bold">{labelsTabErr}</p>}
                                            {labelsTabMsg && <p className="text-emerald-700 text-[10px] font-bold">{labelsTabMsg}</p>}
                                            <section className="space-y-3 rounded-xl border border-slate-200 bg-slate-50/80 p-4">
                                                <h4 className="text-[11px] font-black uppercase text-slate-600 tracking-wider border-b border-slate-200 pb-2">新增 Site</h4>
                                                <div className="flex flex-wrap gap-2">
                                                    <input value={newSiteInput} onChange={(e) => { setNewSiteInput(e.target.value); setLabelsTabErr(""); setLabelsTabMsg(""); }} onKeyDown={(e) => e.key === "Enter" && addSiteItem()} placeholder="新增 Site" className="min-w-[12rem] flex-1 px-3 py-2 bg-white border-2 border-slate-200 rounded-xl text-[11px] outline-none focus:border-blue-500" maxLength={120} />
                                                    <button type="button" onClick={addSiteItem} className="px-4 py-2 bg-slate-900 text-white font-black rounded-xl hover:bg-blue-600 uppercase text-[10px] shrink-0">新增</button>
                                                </div>
                                            </section>
                                            <section className="space-y-2 rounded-xl border border-slate-200 bg-slate-50/80 p-4">
                                                <h4 className="text-[11px] font-black uppercase text-slate-600 tracking-wider border-b border-slate-200 pb-2">Site 清單</h4>
                                                <ul className="max-h-72 overflow-y-auto custom-scrollbar space-y-1 text-[11px] font-bold">
                                                    {siteList.map((name) => (
                                                        <li key={name} className="flex items-center justify-between gap-2 bg-white border border-slate-200 rounded-lg px-3 py-2">
                                                            <span className="font-mono text-slate-800">{name}</span>
                                                            <button type="button" onClick={() => removeSiteItem(name)} disabled={siteList.length <= 1} className={`text-[10px] font-black uppercase px-2 py-1 rounded border ${siteList.length <= 1 ? "text-slate-300 border-slate-100 cursor-not-allowed" : "text-red-600 border-red-200 hover:bg-red-50"}`}>刪除</button>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </section>
                                        </>
                                    )}
                                    {settingsTab === "admin" && (
                                        <>
                                            <section className="space-y-3">
                                                <h4 className="text-[11px] font-black uppercase text-slate-500 tracking-wider flex items-center gap-2 border-b border-slate-100 pb-2"><Icon name="lock" size={16} /> Edit mode</h4>
                                                <p className="text-slate-500 text-[10px] font-bold leading-relaxed">
                                                    編輯模式密碼<strong>同步存於 Google 試算表</strong>（GAS DocumentProperties），所有使用同一支 Web App 的人共用一份。
                                                    <br />
                                                    <strong>預設無密碼</strong>（人人可解鎖）。若想加上輕量保護，可在下方輸入密碼並儲存；想取消保護則清空後再儲存即可。
                                                </p>
                                                <p className="text-[9px] text-amber-700 font-bold leading-relaxed">
                                                    安全提醒：此密碼以明文存於 DocumentProperties，僅用於前端「軟性閘門」，<strong>不是真正的存取控制</strong>（任何拿到 GAS URL 的人都能 GET 到資料）。真正的權限請靠 Web App 部署設定（限定特定 Google 帳號）。
                                                </p>
                                                {adminSyncMsg && <p className="text-amber-700 text-[10px] font-bold bg-amber-50 border border-amber-200 rounded px-2 py-1">{adminSyncMsg}</p>}
                                                {!editPasswordLoaded && <p className="text-slate-500 text-[10px] font-bold">正在從 Google 試算表載入密碼設定…</p>}
                                                <div className="rounded-xl border-2 border-slate-200 bg-slate-50/80 p-3">
                                                    <div className="text-[9px] font-black uppercase text-slate-500 tracking-wider mb-1">目前雲端狀態</div>
                                                    <div className="text-[12px] font-black text-slate-800">
                                                        {editPasswordLoaded
                                                            ? (editPassword ? "已設定密碼（解鎖需輸入）" : "未設定密碼（直接點 Enable edit mode 即可解鎖）")
                                                            : "讀取中…"}
                                                    </div>
                                                </div>
                                                {/* 解鎖編輯模式的入口已搬到主 UI header，這裡只保留密碼設定。
                                                    能進到 Admin 分頁代表已通過密碼 gate（或本就無密碼），可直接改密碼。 */}
                                                <div className="space-y-1 max-w-md">
                                                    <label className="block text-[9px] font-black text-slate-400 uppercase">設定 / 變更雲端密碼（留空 = 清除密碼）</label>
                                                    <input type="password" value={editPassDraft} onChange={(e) => { setEditPassDraft(e.target.value); setAdminPassMsg(""); }} className="w-full px-3 py-2 bg-slate-50 border-2 border-slate-100 rounded-xl text-[11px] outline-none focus:border-blue-500" autoComplete="new-password" placeholder="輸入新密碼，或留空清除" />
                                                    <div className="flex flex-wrap gap-2 items-center pt-1">
                                                        <button type="button" onClick={saveEditPasscode} disabled={!normalizeGasUrl(gasUrl) || !editPasswordLoaded} className={`px-3 py-1.5 font-black rounded-lg uppercase text-[10px] ${(normalizeGasUrl(gasUrl) && editPasswordLoaded) ? 'bg-slate-900 text-white hover:bg-blue-600' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>儲存到雲端</button>
                                                        {isEditMode && <button type="button" onClick={() => setIsEditMode(false)} className="px-3 py-1.5 bg-orange-100 text-orange-800 border border-orange-300 font-black rounded-lg uppercase text-[10px]">Exit edit mode</button>}
                                                    </div>
                                                    {adminPassMsg && <p className={`text-[10px] font-bold ${adminPassMsg.includes("失敗") || adminPassMsg.includes("超過") || adminPassMsg.includes("請先") ? "text-red-600" : "text-emerald-700"}`}>{adminPassMsg}</p>}
                                                    <p className="text-[10px] text-slate-500 font-bold leading-relaxed pt-1">
                                                        提示：解鎖編輯模式的入口已移至上方 header。要切換到無密碼狀態，留空後按「儲存到雲端」即可。
                                                    </p>
                                                </div>
                                            </section>
                                        </>
                                    )}
                                    {settingsTab === "gas" && (
                                        <>
                                            <section className="space-y-3">
                                                <h4 className="text-[11px] font-black uppercase text-slate-500 tracking-wider flex items-center gap-2 border-b border-slate-100 pb-2"><Icon name="database" size={16} /> Google Apps Script · Web App URL</h4>
                                                <p className="text-slate-600 text-[10px] font-bold leading-relaxed">
                                                    每位使用者可在這裡貼上<strong>自己的</strong>部署網址（結尾為 <code className="bg-slate-100 px-1 rounded">/exec</code>），此瀏覽器會記住網址並向對應的試算表讀寫資料。
                                                </p>
                                                <div className="rounded-xl border-2 border-emerald-200 bg-emerald-50/80 p-3 space-y-2">
                                                    <div className="text-[9px] font-black uppercase text-emerald-800 tracking-wider">目前使用中的網址</div>
                                                    <div className="text-[10px] font-mono text-emerald-950 break-all leading-relaxed">
                                                        {normalizeGasUrl(gasUrl) || <span className="text-amber-700 font-sans">（尚未設定 — 請在下方貼上網址並儲存）</span>}
                                                    </div>
                                                </div>
                                                {normalizeGasUrl(gasUrl) && (
                                                    <div className="rounded-xl border-2 border-violet-200 bg-violet-50/90 p-3 space-y-2">
                                                        <div className="text-[9px] font-black uppercase text-violet-800 tracking-wider">分享連結（含 GAS URL）</div>
                                                        <p className="text-[10px] text-violet-900 font-bold leading-relaxed">
                                                            以下為<strong>目前頁面網址</strong>並附上 <code className="bg-white/80 px-1 rounded border border-violet-200">?gas=</code> 參數。他人開啟後會自動使用同一支 Web App（並寫入對方瀏覽器）。若部署含敏感資料請勿公開分享。
                                                        </p>
                                                        <p className="text-[9px] text-violet-700/90 font-bold leading-relaxed">若連結為 <code className="bg-white/60 px-0.5 rounded">localhost</code> 或本機路徑，僅在該環境有效；要給他人請將本頁架在可公開存取的網址後再複製。</p>
                                                        <input readOnly value={shareableChartUrl} onFocus={(e) => e.target.select()} className="w-full px-3 py-2 bg-white border-2 border-violet-200 rounded-xl text-[10px] font-mono text-violet-950 break-all outline-none focus:border-violet-500" spellCheck={false} />
                                                        <div className="flex flex-wrap items-center gap-2">
                                                            <button type="button" onClick={() => copyShareableChartUrl("settings")} className="px-4 py-2 bg-violet-700 text-white font-black rounded-xl hover:bg-violet-800 transition-all uppercase text-[10px]">複製分享連結</button>
                                                            {shareLinkCopyMsg ? <span className="text-emerald-700 text-[10px] font-bold">{shareLinkCopyMsg}</span> : null}
                                                        </div>
                                                    </div>
                                                )}
                                            </section>
                                            <section className="space-y-3 rounded-xl border border-slate-200 bg-slate-50 p-4">
                                                <h4 className="text-[11px] font-black text-slate-700 border-b border-slate-200 pb-2">如何建立專屬 GAS Web App 網址（初學指引）</h4>
                                                <ol className="list-decimal pl-4 space-y-2 text-[10px] text-slate-700 font-bold leading-relaxed">
                                                    <li>在 Google 雲端硬碟<strong>建立一個試算表</strong>（或開啟既有試算表），作為你的資料庫。</li>
                                                    <li>試算表中依本工具需要的欄位建立資料（或複製公版試算表結構）。</li>
                                                    <li>選單<strong>「擴充功能」→「Apps Script」</strong>，開啟指令碼編輯器；撰寫或貼上與本頁相容的程式（需實作讀取試算表並以 JSON 陣列回傳、以及接收 POST 寫回等邏輯 — 請參考專案 README 或公版 Apps Script 範本）。</li>
                                                    <li>在編輯器右上角點<strong>「部署」→「新增部署作業」</strong>，類型選<strong>「網頁應用程式」</strong>。</li>
                                                    <li>「執行身分」通常選<strong>「我」</strong>；「具有存取權的使用者」依需求選<strong>「所有人」</strong>或僅限機構成員（注意：任何人可存取時請勿放敏感資料）。</li>
                                                    <li>部署完成後，複製<strong>「網頁應用程式」網址</strong>，確認格式為 <code className="bg-white px-1 rounded border">https://script.google.com/macros/s/…/exec</code>。</li>
                                                    <li>將網址貼到下方欄位，先按<strong>「測試網址」</strong>確認會回傳 JSON 陣列，再按<strong>「儲存並連線」</strong>。之後同一瀏覽器會自動使用此網址。</li>
                                                </ol>
                                                <p className="text-[9px] text-slate-500 font-bold pt-1 border-t border-slate-200">若更換試算表僅需在同一 Apps Script 專案中改連結的表，通常不必改網址；若新建了另一個 Script 專案並重新部署，才需要換新的 <code className="bg-white px-0.5 rounded">/exec</code> 網址。</p>
                                            </section>
                                            <section className="space-y-3 pt-1 border-t border-slate-200">
                                                <h4 className="text-[11px] font-black uppercase text-slate-500 tracking-wider">變更為新的 Web App 網址</h4>
                                                <label className="block text-[9px] font-black text-slate-400 uppercase">Web App URL（貼上完整網址）</label>
                                                <textarea value={gasUrlDraft} onChange={(e) => { setGasUrlDraft(e.target.value); setSettingsUrlError(""); setSettingsTestOk(""); }} rows={4} spellCheck={false} placeholder="https://script.google.com/macros/s/…/exec" className="w-full px-3 py-2 bg-white border-2 border-slate-200 rounded-xl text-[11px] font-mono outline-none focus:border-blue-500 resize-y min-h-[5rem]" />
                                                {settingsUrlError && <p className="text-red-600 text-[10px] font-bold">{settingsUrlError}</p>}
                                                {settingsTestOk && <p className="text-emerald-700 text-[10px] font-bold">{settingsTestOk}</p>}
                                                <div className="flex flex-wrap gap-2">
                                                    <button type="button" onClick={applyGasUrlFromSettings} className="px-4 py-2 bg-slate-900 text-white font-black rounded-xl hover:bg-blue-600 transition-all uppercase text-[10px]">儲存並連線</button>
                                                    <button type="button" onClick={testDraftGasUrl} className="px-4 py-2 bg-blue-50 text-blue-800 border border-blue-200 font-black rounded-xl hover:bg-blue-100 uppercase text-[10px]">測試網址</button>
                                                    <button type="button" onClick={resetGasUrlToDefault} className="px-4 py-2 text-slate-500 font-bold hover:bg-slate-100 rounded-xl uppercase text-[10px] ml-auto">還原內建預設網址</button>
                                                </div>
                                            </section>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Edit Modal */}
                    {showModal && (
                        <div className="fixed inset-0 z-[4000] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4 overflow-y-auto font-sans font-black">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200 text-left font-black font-sans font-black">
                                <div className="bg-slate-900 px-6 py-4 flex justify-between items-center text-white">
                                    <h2 className="font-black uppercase tracking-widest text-sm font-black font-sans">{originalProjectName ? 'Update' : 'New'} Project</h2>
                                    <button onClick={()=>setShowModal(false)} className="hover:text-red-400 transition-all font-black font-sans font-black"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="p-6 space-y-4 font-black font-sans font-black">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 pb-4 border-b border-slate-100 font-black">
                                        <div className="col-span-2 md:col-span-1 font-black">
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1 font-black">Project Name</label>
                                            <input value={modalData.project} onChange={e=>setModalData({...modalData, project: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border rounded-lg font-black text-blue-600 outline-none focus:ring-1 focus:ring-blue-500 font-black font-sans font-black" />
                                        </div>
                                        <div className="font-black">
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1 underline decoration-blue-400 font-black">Series</label>
                                            <select value={modalData.category} onChange={e=>setModalData({...modalData, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border rounded-lg font-black outline-none font-black font-sans">
                                                {dynamicOptions.categories.map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div className="font-black">
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1 font-black">PIC</label>
                                            <input value={modalData.pic} onChange={e=>setModalData({...modalData, pic: e.target.value})} placeholder="e.g. Sherry/Nick" className="w-full px-3 py-2 bg-slate-50 border rounded-lg font-bold outline-none focus:ring-1 focus:ring-blue-500 font-black font-sans" />
                                        </div>
                                        <div className="font-black">
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1 font-black">Site</label>
                                            <select value={modalData.site} onChange={e=>setModalData({...modalData, site: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border rounded-lg font-bold outline-none font-black font-sans font-black">
                                                {dynamicOptions.sites.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center text-[11px] font-black uppercase text-slate-700 font-black font-sans font-black">
                                        <span className="font-black">Milestones Planning</span>
                                        <button onClick={()=>setModalData({...modalData, phases: [...modalData.phases, {localId: Date.now(), task:"", type:"DevelopmentTNRS", start: formatDate(new Date()), end: formatDate(new Date())}]})} className="text-blue-600 bg-blue-50 px-3 py-1 rounded border hover:bg-blue-100 font-bold font-black font-black font-black font-black font-black">+ Add Phase</button>
                                    </div>
                                    <div className="max-h-60 overflow-y-auto space-y-3 custom-scrollbar pr-1 font-black">
                                        {modalData.phases.map(phase => (
                                            <div key={phase.localId} className="flex items-end gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200 font-black">
                                                <div className="flex-1 grid grid-cols-2 gap-3 font-black">
                                                    <div className="col-span-1 font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">Task Description</label><input value={phase.task} onChange={e=>setModalData({...modalData, phases: modalData.phases.map(p=>p.localId===phase.localId?{...p, task: e.target.value}:p)})} className="w-full px-2 py-1 text-[11px] border rounded font-black outline-none focus:border-blue-500 font-black font-sans" /></div>
                                                    <div className="col-span-1 font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">Phase Type</label>
                                                        <div className="flex flex-wrap gap-1 font-black font-black font-black font-black">
                                                            {phaseList.map((info) => {
                                                                const isSelected = phase.type === info.key;
                                                                const selectedStyle = isSelected
                                                                    ? { backgroundColor: info.color, color: getReadableTextColor(info.color), borderColor: 'transparent' }
                                                                    : undefined;
                                                                return (
                                                                    <button
                                                                        key={info.key}
                                                                        onClick={() => setModalData({...modalData, phases: modalData.phases.map(p => p.localId === phase.localId ? {...p, type: info.key} : p)})}
                                                                        style={selectedStyle}
                                                                        className={`px-2 py-1 rounded text-[8px] font-black border transition-all font-black font-black font-black ${isSelected ? 'shadow-sm ring-1 ring-slate-400' : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'}`}
                                                                    >
                                                                        {info.label}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                    <div className="font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">Start Date</label><input type="date" value={formatDate(phase.start)} onChange={e=>setModalData({...modalData, phases: modalData.phases.map(p=>p.localId===phase.localId?{...p, start: e.target.value}:p)})} className="w-full px-2 py-1 text-[11px] border rounded font-mono outline-none font-black font-sans font-black font-black font-black font-black" /></div>
                                                    <div className="font-black"><label className="block text-[8px] font-black text-slate-400 uppercase font-black font-black font-black font-black font-black">End Date</label><input type="date" value={formatDate(phase.end)} onChange={e=>setModalData({...modalData, phases: modalData.phases.map(p=>p.localId===phase.localId?{...p, end: e.target.value}:p)})} className="w-full px-2 py-1 text-[11px] border rounded font-mono outline-none font-black font-sans font-black font-black font-black font-black" /></div>
                                                </div>
                                                <button onClick={()=>setModalData({...modalData, phases: modalData.phases.filter(p=>p.localId!==phase.localId)})} className="p-2 text-red-300 hover:text-red-500 hover:bg-red-50 rounded transition-all font-black font-sans font-black font-black font-black font-black font-black font-black"><Icon name="x" size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-4 pt-4 border-t font-black font-black font-black font-black font-black font-black font-black">
                                        {originalProjectName && <button onClick={()=>{if(window.confirm('Are you sure you want to delete this project?')){const updated=tasks.filter(t=>formatText(t.project)!==originalProjectName); setTasks(updated); handleSaveToCloud(updated); setShowModal(false);}}} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg font-black uppercase text-[10px] font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Delete Project</button>}
                                        <button onClick={()=>setShowModal(false)} className="px-5 py-2 text-slate-500 font-black ml-auto uppercase text-[10px] font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Cancel</button>
                                        <button onClick={()=>{
                                            let newTasks = [...tasks];
                                            if(originalProjectName) newTasks = newTasks.filter(t=>formatText(t.project)!==originalProjectName);
                                            const push = modalData.phases.map(p=>({project: modalData.project, category: modalData.category, pic: modalData.pic, site: modalData.site, task: p.task, type: normalizeTypeKey(p.type, phaseKeys), start: p.start, end: p.end}));
                                            const final = [...newTasks, ...push];
                                            setTasks(final);
                                            handleSaveToCloud(final);
                                            setShowModal(false);
                                        }} className="px-10 py-2 bg-slate-900 text-white rounded-lg font-black uppercase text-[10px] shadow-lg hover:bg-slate-800 transition-all font-black font-sans font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black font-black">Sync Update</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
